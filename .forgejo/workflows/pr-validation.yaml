name: PR Validation

# Issue #747 — minimal default token scope (Fork-PR-Guard).
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@v31.11.1
      - name: Renovate audit + YAML lint
        run: nix develop -c just ci-lint

  kustomize-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@v31.11.1
      - name: Kustomize build + kubeconform
        run: nix develop -c just kustomize-validate

  helm-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@v31.11.1
      - name: Helm chart render + kubeconform
        run: nix develop -c just helm-render
