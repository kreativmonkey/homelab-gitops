# Trivy exceptions: exact inventory paths only. A same-rule finding in any new
# path remains visible. Each exception below maps to issue #781 inventory.
secrets:
  # Masked historical Gitleaks suppression evidence self-triggers Trivy;
  # no live credential is present.
  - id: private-key
    paths:
      - ".gitleaks.baseline.json"
misconfigurations:
  # Exact Authentik OAuth blueprints: client_secret is !Env-injected, never literal.
  - id: AVD-KSV-0109
    statement: "Exact Authentik OAuth blueprints: client_secret is !Env-injected, never literal."
    paths:
      - "apps/base/authentik/blueprints/audiobookshelf-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/dawarich-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/forgejo-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/gatus-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/goloom-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/grafana-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/homelable-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/immich-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/kavita-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/kite-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/linkding-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/linkwarden-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/nextcloud-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/outline-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/paperless-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/pcm-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/sparky-fitness-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/tandoor-oauth.configmap.yaml"
      - "apps/base/authentik/blueprints/teslamate-grafana-oauth.configmap.yaml"
  # These ConfigMaps only MENTION secret-like key names (PASSWORD/TOKEN/SECRET)
  # or reference secrets via env vars / placeholders ({{VAR}}, ${VAR},
  # os.environ[...]). No literal secret value is stored. Verified 2026-08-22.
  - id: AVD-KSV-0109
    statement: "Key-name heuristic false positive; no literal secret stored (env/placeholder refs only)."
    paths:
      - "apps/base/dawarich/configmap.yaml"
      - "apps/base/homepage/configmap.yaml"
      - "apps/base/monitoring/ntfy-bridge/configmap.yaml"
      - "apps/base/teslamate/teslamate-grafana-config.configmap.yaml"
      - "apps/base/unifi-controller/configmap.yaml"
      - "apps/overlays/main/cluster-config.yaml"
      - "infrastructure/base/remediation-api/configmap.yaml"
  # Flux's own ClusterRoles (gotk-components) by design manage all resources
  # and secrets — that is the GitOps controller's required RBAC.
  - id: AVD-KSV-0046
    paths:
      - "clusters/main/flux-system/gotk-components.yaml"
  - id: AVD-KSV-0041
    paths:
      - "clusters/main/flux-system/gotk-components.yaml"
  # apps/base/forgejo/runner-deployment.yaml: dind needs privileged mode to build CI images.
  - id: AVD-KSV-0017
    paths:
      - "apps/base/forgejo/runner-deployment.yaml"
  # apps/base/fs-health-exporter/daemonset.yaml: exporter needs readonly host mounts for node filesystem metrics.
  - id: AVD-KSV-0121
    paths:
      - "apps/base/fs-health-exporter/daemonset.yaml"
  # apps/base/netbird/daemonset.yaml: node agent needs SYS_ADMIN, host networking, and privileged TUN setup.
  - id: AVD-KSV-0005
    paths:
      - "apps/base/netbird/daemonset.yaml"
  - id: AVD-KSV-0009
    paths:
      - "apps/base/netbird/daemonset.yaml"
  - id: AVD-KSV-0017
    paths:
      - "apps/base/netbird/daemonset.yaml"
  # Intentional LAN endpoints for Paperless ingestion and external TeslaMate MQTT clients.
  - id: AVD-KSV-0108
    paths:
      - "apps/base/paperless-ngx/scanner-smb-deployment.yaml"
      - "apps/base/teslamate/mosquitto-external-service.yaml"
  # apps/base/watchyourlan/daemonset.yaml: L2 device discovery needs host networking, privileged raw sockets, and NET_RAW.
  - id: AVD-KSV-0009
    paths:
      - "apps/base/watchyourlan/daemonset.yaml"
  - id: AVD-KSV-0017
    paths:
      - "apps/base/watchyourlan/daemonset.yaml"
  - id: AVD-KSV-0119
    paths:
      - "apps/base/watchyourlan/daemonset.yaml"
  # pods/exec: create IS the backup mechanism (pg_dump in CNPG primaries,
  # php occ und tar im Nextcloud-Pod). Ziele werden zur Laufzeit per Label-
  # Selector aufgelöst (-l role=primary etc.), weil CNPG-Primaries bei
  # Failover den Pod wechseln — resourceNames: ist dafür konstruktiv
  # unmöglich. Bereits namespace-scoped auf nextcloud und cnpg-system
  # (verifiziert: kein Zugriff in kube-system), kein delete, Secrets nur via
  # resourceNames. Residuales Risiko bewusst akzeptiert und benannt: exec in
  # einen CNPG-Primary bedeutet postgres-Superuser, also Lesezugriff auf
  # jede Datenbank in diesem Cluster. Verifiziert 2026-09-24.
  - id: AVD-KSV-0053
    statement: "pods/exec: create IS the backup mechanism (pg_dump/php occ/tar); targets resolved at runtime via label selectors since CNPG primaries move on failover, so resourceNames scoping is constructively impossible. Already namespace-scoped to nextcloud/cnpg-system (verified denied in kube-system), no delete, secrets only via resourceNames. Residual risk accepted: exec into a CNPG primary means postgres superuser, i.e. read access to every database in that cluster. Verified 2026-09-24."
    paths:
      - "infrastructure/base/offsite-backup/rbac.yaml"
  # Issue #746: duplicate container-hardening findings tracked through the
  # namespace rollout. Listed paths only; any same-rule finding in a new path fails.
  - id: AVD-KSV-0014
