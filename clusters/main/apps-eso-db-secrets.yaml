apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-eso-db-secrets
  namespace: flux-system
spec:
  # The apps Kustomization creates the namespaces and does not wait for pods.
  dependsOn:
    - name: apps
    - name: infra-secrets
  path: ./apps/overlays/main/eso-db-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
