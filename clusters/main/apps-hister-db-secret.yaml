apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hister-db-secret
  namespace: flux-system
spec:
  # The apps Kustomization creates the Hister namespace without waiting on
  # its Pod. Kubelet waits for the referenced Secret before starting Hister.
  dependsOn:
    - name: apps
    - name: infra-secrets
  path: ./apps/overlays/main/hister-db-secret
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
