apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: searxng-secret
  namespace: flux-system
spec:
  dependsOn:
    - name: apps
    - name: infra-secrets
  path: ./infrastructure/overlays/main/searxng-secret
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
