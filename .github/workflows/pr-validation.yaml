name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0

      - name: Run validation (includes Renovate audit + kind server-side dry-run)
        env:
          ENABLE_KIND_CI: "1"
        run: nix develop -c just validate-full
