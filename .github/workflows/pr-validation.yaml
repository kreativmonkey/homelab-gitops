name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
      - name: Renovate audit + YAML lint
        run: nix develop -c just ci-lint

  kustomize-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
      - name: Kustomize build + kubeconform
        run: nix develop -c just kustomize-validate

  helm-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
      - name: Helm chart render + kubeconform
        run: nix develop -c just helm-render

  server-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
      - name: Server-side dry-run (kind)
        env:
          ENABLE_KIND_CI: "1"
        run: nix develop -c just server-dry-run

  # Experimental — not a required check. Exercises the same server-dry-run
  # stage against Talos-in-Docker instead of kind, to see whether talosctl's
  # docker provisioner works cleanly on a GitHub-hosted runner. Remove this
  # job (or promote it to replace/parallel the kind job as a required check)
  # once that's confirmed.
  server-dry-run-talos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.0
      - name: Server-side dry-run (talos)
        env:
          ENABLE_KIND_CI: "1"
          CLUSTER_PROVISIONER: "talos"
        run: nix develop -c just server-dry-run
