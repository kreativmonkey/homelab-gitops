apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-secret-eso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: homelab
  target:
    creationPolicy: Owner
  data:
    - secretKey: SEARXNG_SECRET
      remoteRef:
        key: searxng-key-v2
        property: password
