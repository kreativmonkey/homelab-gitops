apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-postgres-dawarich-eso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: homelab
  target:
    creationPolicy: Owner
    template:
      data:
        username: dawarich
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: db-dawarich
        property: password
