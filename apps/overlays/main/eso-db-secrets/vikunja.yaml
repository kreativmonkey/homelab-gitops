apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-store-reader
  namespace: vikunja
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-store-token
  namespace: vikunja
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    verbs: [create]
    resourceNames: [eso-store-reader]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-store-token
  namespace: vikunja
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-store-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: homelab
  namespace: vikunja
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-source
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-store-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-postgres-vikunja-eso
  namespace: vikunja
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: homelab
  target:
    creationPolicy: Owner
    template:
      data:
        username: vikunja
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: db-vikunja
        property: password
