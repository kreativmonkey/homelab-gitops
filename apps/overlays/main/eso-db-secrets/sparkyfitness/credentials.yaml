apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-postgres-sparkyfitness-eso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: homelab
  target:
    creationPolicy: Owner
    template:
      data:
        username: sparkyfitness
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: db-sparkyfitness
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-postgres-sparkyfitness-app-eso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: homelab
  target:
    creationPolicy: Owner
    template:
      data:
        username: sparkyfitness_app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: db-sparkyfitness-app
        property: password
