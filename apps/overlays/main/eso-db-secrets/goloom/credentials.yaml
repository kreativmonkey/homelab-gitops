apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: goloom-db-credentials-eso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: homelab
  target:
    creationPolicy: Owner
    template:
      data:
        DATABASE_URL: "postgres://goloom:{{ .password }}@homelab-postgres-rw.cnpg-system.svc.cluster.local:5432/goloom?sslmode=disable"
  data:
    - secretKey: password
      remoteRef:
        key: db-goloom
        property: password
