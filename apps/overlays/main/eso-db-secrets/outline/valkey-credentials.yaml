apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-valkey-eso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: homelab
  target:
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        redis-username: default
        redis-password: "{{ .password }}"
        # Valkey can mount this ACL without receiving the raw password.
        users.acl: |
          user default on #{{ .password | sha256sum }} ~* &* +@all
  data:
    - secretKey: password
      remoteRef:
        key: outline-valkey-key
        property: password
