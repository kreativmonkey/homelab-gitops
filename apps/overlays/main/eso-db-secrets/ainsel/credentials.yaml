apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ainsel-hub-db-eso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: homelab
  target:
    creationPolicy: Owner
    template:
      data:
        database: ainsel
        username: ainsel
        password: "{{ .password }}"
        dsn: "postgres://ainsel:{{ .password }}@homelab-postgres-rw.cnpg-system.svc.cluster.local:5432/ainsel?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: db-ainsel
        property: password
