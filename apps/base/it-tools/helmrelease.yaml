apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: it-tools
  namespace: it-tools
spec:
  interval: 1h
  timeout: 10m
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chartRef:
    kind: OCIRepository
    name: it-tools-chart
    namespace: flux-system
  values:
    controllers:
      main:
        replicas: 2
        strategy: RollingUpdate
        podDisruptionBudget:
          minAvailable: 1
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: it-tools
        containers:
          main:
            image:
              repository: ghcr.io/corentinth/it-tools
              tag: 2024.10.22-7ca5933
            # Upstream image serves static files with nginx on port 80.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
                # Root nginx master prepares cache dirs and drops worker privileges.
                add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            probes:
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 80
              liveness:
                enabled: true
                spec:
                  httpGet:
                    path: /
                    port: 80
    service:
      main:
        controller: main
        ports:
          http:
            port: 80
