# Ersetzt nextcloud-app-iscsi. Dieses Volume traegt keine Nutzerdaten: die
# liegen als Primaerspeicher in Garage/S3 (objectstore \OC\Files\ObjectStore\S3).
# Auf dem Volume steht ausschliesslich Programmcode aus Image und App Store,
# gerenderte ConfigMaps — und genau eine unersetzliche Datei: config/config.php
# mit instanceid, passwordsalt und secret (2902 Byte).
#
# Warum weg von truenas-iscsi: die LUNs auf FastStorage sind seit Juni 2026
# wiederholt in ext4-emergency_ro gelaufen, weil TrueNAS unter Contention
# Writes minutenlang nicht bestaetigt (24.08.: 180s). Nextcloud traf es am
# haeufigsten, weil sein Cron alle 5 Minuten schreibt. Dieselbe Umstellung hat
# die CNPG-Failover-Kaskade beendet: dort fielen die Postgres-Restarts von
# 19/Tag auf 7 in 30 Tagen.
#
# Warum ein statisches `local`-PV und nicht die StorageClass local-path:
# local-path liefert PVs vom Typ `hostPath`, und damit funktioniert `subPath`
# nicht — kubelet bindet dann ein leeres Verzeichnis ein, ohne Fehler zu
# melden. Das Nextcloud-Chart mountet sieben subPaths (root, html, data,
# config, custom_apps, tmp, themes). Begruendung siehe
# infrastructure/base/storage/local-node-storageclass.yaml.
#
# Preis: das Volume haengt an talos-cp1, der Pod ist damit ueber nodeAffinity
# dorthin gepinnt. Vertretbar, weil der Zustand 2,9 KB gross und aus dem
# Velero-Backup wiederherstellbar ist.
#
# Der Pfad traegt noch den Namen des local-path-Provisioners, weil die Daten
# dort bereits liegen; er wird beim naechsten Wartungsfenster zusammen mit
# LEGACY-MOUNT-PATH /var/lib/longhorn umbenannt.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-app-node
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-node-static
  claimRef:
    namespace: nextcloud
    name: nextcloud-app-node
  local:
    path: /var/lib/longhorn/local-path/pvc-bcd7e514-5336-425f-915d-aaaf64075dcf_nextcloud_nextcloud-app-local
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - talos-cp1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-app-node
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-node-static
  volumeName: nextcloud-app-node
  resources:
    requests:
      storage: 10Gi
