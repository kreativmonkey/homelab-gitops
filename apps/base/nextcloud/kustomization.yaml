  # infrastructure/base/storage/local-node-storageclass.yaml.
  - pvc-iscsi.yaml
  - whiteboard-deployment.yaml
  - appapi-harp-rbac.yaml
  - appapi-harp-deployment.yaml
  - helmrelease.yaml
  - ingress.yaml
