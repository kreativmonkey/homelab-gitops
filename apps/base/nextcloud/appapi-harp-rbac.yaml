apiVersion: v1
kind: ServiceAccount
metadata:
  name: appapi-harp
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: appapi-harp
    app.kubernetes.io/part-of: nextcloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: appapi-harp
  namespace: nextcloud-exapps
  labels:
    app.kubernetes.io/name: appapi-harp
    app.kubernetes.io/part-of: nextcloud
# HaRP v0.4.8 uses only these API operations for ClusterIP ExApps.
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: appapi-harp
  namespace: nextcloud-exapps
  labels:
    app.kubernetes.io/name: appapi-harp
    app.kubernetes.io/part-of: nextcloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: appapi-harp
subjects:
  - kind: ServiceAccount
    name: appapi-harp
    namespace: nextcloud
