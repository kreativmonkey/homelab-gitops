apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-crowdsec-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/part-of: authentik
data:
  crowdsec.yaml: |
    version: 1
    metadata:
      name: Homelab CrowdSec Web UI OIDC
    entries:
      - model: authentik_providers_oauth2.scopemapping
        id: crowdsec-groups
        identifiers:
          name: CrowdSec groups
        attrs:
          name: CrowdSec groups
          scope_name: profile
          expression: |
            return {"groups": [group.name for group in request.user.groups.all()]}
      - model: authentik_providers_oauth2.oauth2provider
        id: crowdsec-provider
        identifiers:
          client_id: crowdsec-web-ui
        attrs:
          name: Provider for CrowdSec Web UI
          client_type: confidential
          client_id: crowdsec-web-ui
          client_secret: !Env OIDC_CROWDSEC_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://crowdsec.f4mily.net/api/auth/oidc/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "Mailcow Mailbox"]]
            - !KeyOf crowdsec-groups
      - model: authentik_core.application
        id: crowdsec-app
        identifiers:
          slug: crowdsec-web-ui
        attrs:
          name: CrowdSec Web UI
          slug: crowdsec-web-ui
          provider: !KeyOf crowdsec-provider
          launch_url: https://crowdsec.f4mily.net
          meta_launch_url: https://crowdsec.f4mily.net
          icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/crowdsec.svg
      - model: authentik_policies_expression.expressionpolicy
        id: crowdsec-access-policy
        identifiers:
          name: crowdsec-web-ui-access
        attrs:
          name: crowdsec-web-ui-access
          expression: |-
            return ak_is_group_member(request.user, name="Admin") or ak_is_group_member(request.user, name="authentik Admins")
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf crowdsec-app
          order: 0
        attrs:
          policy: !KeyOf crowdsec-access-policy
          enabled: true
          negate: false
          timeout: 30
