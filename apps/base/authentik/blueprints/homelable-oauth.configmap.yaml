apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-homelable-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/part-of: authentik
data:
  homelable.yaml: |
    version: 1
    metadata:
      name: Homelab Homelable OIDC
      labels:
        blueprints.goauthentik.io/description: OAuth2 provider and application for Homelable
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: homelable-provider
        identifiers:
          client_id: homelab-homelable
        attrs:
          name: Provider for Homelable
          client_type: confidential
          client_id: homelab-homelable
          client_secret: !Env OIDC_HOMELABLE_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          encryption_key: null
          redirect_uris:
            - matching_mode: strict
              url: https://homelable.f4mily.net/api/v1/auth/oidc/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
      - model: authentik_core.application
        identifiers:
          slug: homelable
        attrs:
          name: Homelable
          slug: homelable
          provider: !KeyOf homelable-provider
          launch_url: https://homelable.f4mily.net
          meta_launch_url: https://homelable.f4mily.net
