apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-ainsel-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/part-of: authentik
data:
  ainsel.yaml: |
    version: 1
    metadata:
      name: Homelab Ainsel OIDC
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: ainsel-provider
        identifiers:
          client_id: homelab-ainsel
        attrs:
          name: Provider for Ainsel
          # Browser SPA uses authorization code + PKCE. No browser client secret.
          client_type: public
          client_id: homelab-ainsel
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://ainsel.cluster.f4mily.net/auth/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "OAuth Mapping: email with email_verified true"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'offline_access'"]]
      - model: authentik_core.application
        id: ainsel-app
        identifiers:
          slug: ainsel
        attrs:
          name: Ainsel
          slug: ainsel
          provider: !KeyOf ainsel-provider
          group: Development
          icon: https://ainsel.cluster.f4mily.net/favicon.svg
          launch_url: https://ainsel.cluster.f4mily.net
          meta_launch_url: https://ainsel.cluster.f4mily.net
      - model: authentik_policies_expression.expressionpolicy
        id: ainsel-access-policy
        identifiers:
          name: ainsel-access
        attrs:
          name: ainsel-access
          expression: |-
            return ak_is_group_member(request.user, name="Admin") or ak_is_group_member(request.user, name="authentik Admins")
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf ainsel-app
          order: 0
        attrs:
          policy: !KeyOf ainsel-access-policy
          enabled: true
          negate: false
          timeout: 30
