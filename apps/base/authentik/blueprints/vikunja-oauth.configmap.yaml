apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-vikunja-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/part-of: authentik
data:
  vikunja.yaml: |
    version: 1
    metadata:
      name: Homelab Vikunja OIDC
      labels:
        blueprints.goauthentik.io/description: OAuth2 provider, team-sync scope mapping and group-bound application for Vikunja
    entries:
      # Team sync (https://vikunja.io/docs/openid): Vikunja reads the
      # vikunja_groups claim and creates/updates teams from it. Only the
      # "Familie" group is exposed as a Vikunja team.
      - model: authentik_providers_oauth2.scopemapping
        id: vikunja-scope
        identifiers:
          scope_name: vikunja_scope
        attrs:
          name: Vikunja team sync
          scope_name: vikunja_scope
          description: Maps the Familie group to a Vikunja team
          expression: |-
            groups = []
            for group in request.user.ak_groups.filter(name="Familie"):
                groups.append({
                    "name": group.name,
                    "oidcID": str(group.pk),
                })
            return {"vikunja_groups": groups}
      - model: authentik_providers_oauth2.oauth2provider
        id: vikunja-provider
        identifiers:
          client_id: homelab-vikunja
        attrs:
          name: Provider for Vikunja
          client_type: confidential
          client_id: homelab-vikunja
          # Injected into the worker from the authentik-oidc-client-secrets Secret
          # (private repo, key OIDC_VIKUNJA_CLIENT_SECRET). Never hardcode it.
          client_secret: !Env OIDC_VIKUNJA_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            # /auth/openid/<provider-id>; provider id in the Vikunja config is "authentik".
            - matching_mode: strict
              url: https://aufgaben.f4mily.net/auth/openid/authentik
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !KeyOf vikunja-scope
      - model: authentik_core.application
        id: vikunja-app
        identifiers:
          slug: vikunja
        attrs:
          name: Vikunja
          slug: vikunja
          provider: !KeyOf vikunja-provider
          group: Office
          launch_url: https://aufgaben.f4mily.net
          meta_launch_url: https://aufgaben.f4mily.net
          icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/vikunja.svg
      # Access limited to the existing family group (and admins).
      - model: authentik_policies_expression.expressionpolicy
        id: vikunja-access-policy
        identifiers:
          name: vikunja-access
        attrs:
          name: vikunja-access
          expression: |-
            return ak_is_group_member(request.user, name="Familie") or ak_is_group_member(request.user, name="Admin") or ak_is_group_member(request.user, name="authentik Admins")
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf vikunja-app
          order: 0
        attrs:
          policy: !KeyOf vikunja-access-policy
          enabled: true
          negate: false
          timeout: 30
