apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-omni-blueprint
  namespace: authentik
  labels:
    app.kubernetes.io/part-of: authentik
data:
  omni.yaml: |
    version: 1
    metadata:
      name: Homelab Omni OIDC
      labels:
        blueprints.goauthentik.io/description: OAuth2 provider and application for Sidero Omni (Talos management, srv1)
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: omni-provider
        identifiers:
          client_id: omni
        attrs:
          name: Provider for Omni
          client_type: confidential
          client_id: omni
          # Worker env from Secret authentik-oidc-client-secrets-omni (private
          # repo). Same value as /var/lib/omni/secrets/oidc.yaml on srv1
          # (homelab-infrastructure nixos/modules/omni.nix).
          client_secret: !Env OIDC_OMNI_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            - matching_mode: strict
              url: https://omni.f4mily.net/oidc/consume
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            # Omni rejects logins with email_verified=false; the managed
            # default mapping always sends false.
            - !Find [authentik_providers_oauth2.scopemapping, [name, "OAuth Mapping: email with email_verified true"]]
      - model: authentik_core.application
        identifiers:
          slug: omni
        attrs:
          name: Omni
          slug: omni
          provider: !KeyOf omni-provider
          launch_url: https://omni.f4mily.net
          meta_launch_url: https://omni.f4mily.net
          icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/talos.svg
