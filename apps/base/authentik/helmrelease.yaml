apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
  annotations:
    kustomize.toolkit.fluxcd.io/depends-on: postgresql.cnpg.io/Database/cnpg-system/homelab-postgres-authentik
spec:
  interval: 1h
  timeout: 15m
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: authentik
      # Upgrade path: 2026.5.x → 2026.8.x (see docs/migrations/authentik-upgrade-2026.md)
      version: "2026.5.6"
      sourceRef:
        kind: HelmRepository
        name: authentik-repo
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: homelab-postgres-authentik
      valuesKey: password
      targetPath: authentik.postgresql.password
    - kind: Secret
      name: authentik-secret-key
      valuesKey: secret-key
      targetPath: authentik.secret_key
  values:
    global:
      security:
        allowInsecureImages: true
    postgresql:
      enabled: false
    redis:
      enabled: true
      architecture: standalone
      auth:
        enabled: false
      image:
        registry: docker.io
        repository: bitnamilegacy/redis
        tag: 8.2.1-debian-12-r0
      master:
        persistence:
          enabled: false
    authentik:
      postgresql:
        host: homelab-postgres-rw.cnpg-system.svc.cluster.local
        port: 5432
        name: authentik
        user: authentik
      email:
        host: mail.f4mily.net
        port: 465
        username: authentik@f4mily.net
        use_ssl: true
        from: authentik@f4mily.net
        timeout: 10
      error_reporting:
        enabled: true
    # Production DB is authoritative for migrated apps; add new providers here only.
    blueprints:
      configMaps:
        - authentik-paperless-blueprint
        - authentik-gatus-blueprint
        - authentik-linkding-blueprint
        - authentik-dawarich-blueprint
        - authentik-grafana-blueprint
        - authentik-teslamate-grafana-blueprint
        - authentik-goloom-blueprint
        - authentik-kavita-blueprint
        - authentik-kite-blueprint
        - authentik-linkwarden-blueprint
        - authentik-pcm-blueprint
        - authentik-sparky-fitness-blueprint
        - authentik-tandoor-blueprint
        - authentik-outline-blueprint
        - authentik-audiobookshelf-blueprint
        - authentik-forgejo-blueprint
        - authentik-immich-blueprint
        - authentik-nextcloud-blueprint
    server:
      ingress:
        enabled: false
      # HA (#740): replicas=2 + RollingUpdate keep ≥1 pod serving during every
      # rollout / upgrade. maxSurge 0 / maxUnavailable 1 → the new pod is ready
      # before the old is terminated (zero SSO downtime during rollouts).
      # Media PVC stays RWO (iSCSI). RWO allows multiple pods on ONE node to
      # share the volume, but Kubernetes does NOT know that — without explicit
      # affinity a rollout can schedule the new pod on a different node, which
      # then hits "Multi-Attach error" and hangs in Init (#760). The podAffinity
      # below forces both server replicas onto the same node so RWO keeps
      # working. Cross-node spread (true AZ-style HA) still needs RWX media
      # (NFS) + extra worker nodes — tracked in issue #760.
      replicas: 2
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - server
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - authentik
              topologyKey: kubernetes.io/hostname
      # Explicit probes (mirror chart defaults) so a slow DB migration / cold
      # start never gets killed mid-boot. startupProbe gives 60*10s grace.
      startupProbe:
        httpGet:
          path: /-/health/live/
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 60
        successThreshold: 1
      livenessProbe:
        httpGet:
          path: /-/health/live/
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
        successThreshold: 1
      readinessProbe:
        httpGet:
          path: /-/health/ready/
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
        successThreshold: 1
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: media-init
          image: docker.io/library/busybox:1.38
          command:
            - sh
            - -c
            - mkdir -p /data/media/public/application-icons && chown -R 1000:1000 /data
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            runAsUser: 0
      resources:
        requests:
          cpu: 25m
          memory: 768Mi
        limits:
          memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: authentik-media
      volumeMounts:
        - name: data
          mountPath: /data
    worker:
      # HA (#740): decoupled from server, own RollingUpdate + replica. Stateless
      # (pulls tasks from Redis broker), so multiple replicas are safe and keep
      # blueprint/task processing alive during rollouts.
      replicas: 2
      deploymentStrategy:
        type: RollingUpdate
      # OIDC client secrets for the blueprints above. Only the worker applies
      # blueprints, so only it needs them. The blueprints read these via
      # `!Env NAME`; if a variable is missing the blueprint fails instead of
      # writing an empty secret into Authentik.
      #
      # Whole Secret via envFrom, so adding an app means adding one key in the
      # private repo (apps/overlays/main/authentik-private) — no change here and
      # no worker rollout. The keys are already named OIDC_<APP>_CLIENT_SECRET;
      # envFrom silently skips keys that are not valid env var names.
      envFrom:
        - secretRef:
            name: authentik-oidc-client-secrets
      # 2026-06-09: limit raised 2Gi→4Gi (OOMKilled, exit 137)
      #   Previous pod ran 3.5d then OOM. DockerException spam
      #   (outpost_service_connection_monitor → Docker) on Talos
      #   is harmless but adds CPU/memory pressure.
      resources:
        requests:
          cpu: 50m
          memory: 1Gi
        limits:
          memory: 4Gi
