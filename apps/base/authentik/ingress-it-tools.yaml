apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: it-tools
  # Embedded outpost authenticates requests before proxying to it-tools.
  namespace: authentik
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: IT Tools
    gethomepage.dev/description: Developer utilities
    gethomepage.dev/group: Cluster Management
    gethomepage.dev/icon: it-tools.png
    gethomepage.dev/pod-selector: app.kubernetes.io/component=server
    nginx.org/ssl-redirect: "false"
    nginx.org/redirect-to-https: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tools.f4mily.net
      secretName: wildcard-f4mily-net-tls
  rules:
    - host: tools.f4mily.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 80
