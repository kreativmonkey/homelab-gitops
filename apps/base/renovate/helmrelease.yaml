apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: renovate
spec:
  interval: 1h
  timeout: 15m
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: renovate
      version: "46.310.2"
      sourceRef:
        kind: HelmRepository
        name: renovate-repo
        namespace: flux-system
  values:
    cronjob:
      schedule: "0 */4 * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 1
      jobBackoffLimit: 1
      ttlSecondsAfterFinished: 86400
      # Beim job-watchdog anmelden (siehe
      # apps/base/monitoring/rules/job-watchdog-vmrule.yaml): war bisher
      # unangemeldet, deshalb fiel das EACCES-Scheitern seit 23.09.2026 (uid
      # 1000 vs. cache-owner 12021, siehe securityContext-Kommentar unten)
      # nirgendwo als Alert auf. Schedule alle 4h -> max-age-hours 9 (zwei
      # verpasste Laeufe plus Puffer; lastSuccessfulTime wird erst am Ende
      # eines Laufs gesetzt).
      labels:
        homelab.f4mily.net/watchdog: "true"
        homelab.f4mily.net/max-age-hours: "9"

    renovate:
      # GitHub token via RENOVATE_GITHUB_COM_TOKEN in renovate-credentials (existingSecret).
      config: |
        {
          "platform": "gitea",
          "endpoint": "http://forgejo-app.forgejo.svc.cluster.local:3000/api/v1/",
          "autodiscover": true,
          "autodiscoverFilter": ["homelab/*", "Homelab/*", "kreativmonkey/*", "diyon/*"],
          "gitAuthor": "Renovate Bot <renovate@f4mily.net>",
          "onboarding": true,
          "onboardingConfig": {
            "extends": ["config:recommended", ":dependencyDashboard"]
          },
          "timezone": "Europe/Berlin",
          "persistRepoData": true,
          "httpCacheTtlDays": 14
        }

      persistence:
        cache:
          enabled: true
          # Node-lokal, nicht truenas-iscsi. Das Volume ist reiner Cache
          # (Datasource-Antworten, HTTP-Cache, heruntergeladene Tools) und bei
          # Verlust in einem Lauf wieder aufgebaut. Auf iSCSI legte es
          # schreiblastigen Churn auf dieselbe ueberlastete FastStorage, von
          # der Datenbanken und Nextcloud abhaengen.
          storageClass: local-path
          # 10Gi liefen am 26.08.2026 voll (90 %, 1 GB frei) und Renovate
          # brach fuer JEDES Repo mit "Disk space error - skipping" ab. Die
          # Aufteilung damals: 4,4 G cache/renovate (Datasource, TTL ueber
          # cacheHardTtlMinutes, Default 7 Tage), 3,9 G cache/others
          # (HTTP-Cache, TTL httpCacheTtlDays, Default 90 Tage), 0,4 G
          # containerbase. Deshalb oben httpCacheTtlDays auf 14 — das deckelt
          # den groessten unnoetig lang gehaltenen Posten. 20Gi auf der
          # Datenplatte kostet nichts und laesst Luft.
          storageSize: "20Gi"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsGroup: 12021
        runAsNonRoot: true
        runAsUser: 12021

    existingSecret: renovate-credentials

    # These values apply to the CronJob Pod and the Renovate container.
    # uid/gid 12021 statt 1000: das Image laeuft nativ als eingebauter
    # "ubuntu"-User (uid=12021), und die 20Gi renovate-cache-PVC ist komplett
    # (alle ~102k Eintraege, verifiziert 24.09.2026) diesem uid gehoerig. Jeder
    # andere uid scheitert mit EACCES beim Schreiben in
    # /tmp/renovate/cache/__renovate-private-cache. Vor #982 auf 1000 gesetzt
    # und dadurch seit 23.09.2026 bei jedem Lauf gescheitert (silent, da
    # renovate/renovate nicht am Job-Watchdog haengt) — siehe
    # docs/pss-restricted-rollout.md. fsGroupChangePolicy: OnRootMismatch
    # loest beim naechsten Lauf einmalig ein rekursives chgrp ueber die ~102k
    # Cache-Eintraege aus (erwartet, einmalig).
    securityContext:
      fsGroup: 12021
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 12021
      runAsNonRoot: true
      runAsUser: 12021
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
