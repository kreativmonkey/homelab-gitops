apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
  annotations:
    kustomize.toolkit.fluxcd.io/depends-on: postgresql.cnpg.io/Database/cnpg-system/homelab-postgres-immich
spec:
  interval: 1h
  timeout: 20m
  install:
    timeout: 20m
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    remediation:
      retries: 3
  chart:
    spec:
      chart: immich
      version: "0.12.0"
      sourceRef:
        kind: HelmRepository
        name: immich-charts
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: homelab-postgres-immich
      valuesKey: username
      targetPath: controllers.main.containers.main.env.DB_USERNAME
    - kind: Secret
      name: homelab-postgres-immich
      valuesKey: password
      targetPath: controllers.main.containers.main.env.DB_PASSWORD
  values:
    immich:
      persistence:
        library:
          existingClaim: immich-library
    # Chart 0.12+: bundled postgresql/redis subcharts removed; use valkey + external CNPG.
    valkey:
      enabled: true
      persistence:
        data:
          enabled: true
          type: emptyDir
          accessMode: ReadWriteOnce
      controllers:
        main:
          containers:
            main:
              # p95/p99-derived (14d/7d VictoriaMetrics history), previously unset.
              # Cache container -> Guaranteed QoS (request == limit).
              resources:
                requests:
                  cpu: 20m
                  memory: 128Mi
                limits:
                  memory: 128Mi
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME: immich-postgres-rw.cnpg-system.svc.cluster.local
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              # VectorChord on immich-postgres; omit DB_VECTOR_EXTENSION so Immich auto-detects vchord.
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server versioning=semver
              tag: v3.1.0
    server:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.1.0
              # p95/p99-derived (14d/7d VictoriaMetrics history). Previously
              # nested as a sibling of `controllers` under `server:` — that
              # key does not exist in this bjw-s-common-based chart, so Helm
              # silently dropped it and the container ran with no resources
              # at all (confirmed via `helm template`). Correct path is here,
              # under controllers.main.containers.main.
              resources:
                requests:
                  cpu: 10m
                  memory: 1552Mi
                limits:
                  memory: 2432Mi
      persistence:
        data:
          accessMode: ReadWriteOnce
          # bjw-s common v4 (Chart 0.10+): subPath gehört IN den globalMounts-Eintrag.
          # Ein subPath auf Persistence-Ebene wird stillschweigend ignoriert — /data
          # zeigt dann auf die Share-Root statt auf die Immich-Library (Folder-Check
          # stoppt den Start; genau das blockierte das Upgrade von Chart 0.9.3).
          globalMounts:
            - path: /data
              subPath: Bilder
        fotos:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-fotos
          accessMode: ReadWriteOnce
          globalMounts:
            - path: /fotos
              subPath: Fotos
      ingress:
        main:
          enabled: false
    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.1.0
              # p95/p99-derived (14d/7d VictoriaMetrics history). Previously
              # nested as a sibling of `controllers` under `machine-learning:`
              # — same dead-key mistake as immich-server above (see comment
              # there); silently dropped by Helm, container ran unbounded.
              resources:
                requests:
                  cpu: 10m
                  memory: 592Mi
                limits:
                  memory: 1408Mi
      persistence:
        cache:
          enabled: true
          type: emptyDir
          accessMode: ReadWriteMany
