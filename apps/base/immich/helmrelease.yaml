apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
  annotations:
    kustomize.toolkit.fluxcd.io/depends-on: postgresql.cnpg.io/Database/cnpg-system/homelab-postgres-immich
spec:
  interval: 1h
  timeout: 20m
  install:
    timeout: 20m
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    timeout: 20m
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: immich
      version: "0.12.0"
      sourceRef:
        kind: HelmRepository
        name: immich-charts
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: homelab-postgres-immich
      valuesKey: username
      targetPath: controllers.main.containers.main.env.DB_USERNAME
    - kind: Secret
      name: homelab-postgres-immich
      valuesKey: password
      targetPath: controllers.main.containers.main.env.DB_PASSWORD
  values:
    immich:
      persistence:
        library:
          existingClaim: immich-library
    # Chart 0.12+: bundled postgresql/redis subcharts removed; use valkey + external CNPG.
    valkey:
      enabled: true
      persistence:
        data:
          enabled: true
          type: emptyDir
          accessMode: ReadWriteOnce
      controllers:
        main:
          containers:
            main:
              # p95/p99-derived (14d/7d VictoriaMetrics history), previously unset.
              # Cache container -> Guaranteed QoS (request == limit).
              resources:
                requests:
                  cpu: 20m
                  memory: 128Mi
                limits:
                  memory: 128Mi
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME: immich-postgres-rw.cnpg-system.svc.cluster.local
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              # VectorChord on immich-postgres; omit DB_VECTOR_EXTENSION so Immich auto-detects vchord.
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server versioning=semver
              tag: v3.1.0
    server:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.1.0
              # p95/p99-derived (14d/7d VictoriaMetrics history). Previously
              # nested as a sibling of `controllers` under `server:` — that
              # key does not exist in this bjw-s-common-based chart, so Helm
              # silently dropped it and the container ran with no resources
              # at all (confirmed via `helm template`). Correct path is here,
              # under controllers.main.containers.main.
              # Limit auf Peak (1998Mi) + 35 % statt knapp darüber — siehe die
              # ausführliche Begründung bei machine-learning weiter unten.
              resources:
                requests:
                  cpu: 10m
                  memory: 1552Mi
                limits:
                  memory: 2752Mi
      persistence:
        data:
          accessMode: ReadWriteOnce
          # bjw-s common v4 (Chart 0.10+): subPath gehört IN den globalMounts-Eintrag.
          # Ein subPath auf Persistence-Ebene wird stillschweigend ignoriert — /data
          # zeigt dann auf die Share-Root statt auf die Immich-Library (Folder-Check
          # stoppt den Start; genau das blockierte das Upgrade von Chart 0.9.3).
          globalMounts:
            - path: /data
              subPath: Bilder
        fotos:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-fotos
          accessMode: ReadWriteOnce
          globalMounts:
            - path: /fotos
              subPath: Fotos
      ingress:
        main:
          enabled: false
    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.1.0
              # p95/p99-derived (14d/7d VictoriaMetrics history). Previously
              # nested as a sibling of `controllers` under `machine-learning:`
              # — same dead-key mistake as immich-server above (see comment
              # there); silently dropped by Helm, container ran unbounded.
              #
              # Limit-Historie: 1408Mi (= beobachteter 28d-Peak) → OOMKill,
              # dann 1920Mi (Peak + 35 %) → am 2026-08-07 erneut OOMKill.
              #
              # Beide Werte stammten aus container_memory_working_set_bytes.
              # Das war die falsche Metrik: cAdvisor scrapet alle 30s, der
              # Bedarf hier ist aber ein Burst von wenigen Sekunden. Im
              # 30s-Raster blieb die Serie über den OOM hinweg flach bei
              # 265Mi — der Spike ist zwischen zwei Scrapes komplett
              # unsichtbar. Maßgeblich ist stattdessen der cgroup-Highwater
              # container_memory_max_usage_bytes: die früheren, noch
              # unlimitierten Pod-Generationen lagen dort bei 2357–2829Mi.
              #
              # Auslöser des Bursts ist der Cold-Start der Modelle: der
              # Container lädt in ~15s vier ONNX-Sessions gleichzeitig
              # (buffalo_l detection + recognition, CLIP ViT-B-32, seit v3
              # zusätzlich OCR PP-OCRv5) bei 4 Request-Threads. Die alten
              # Messwerte kannten das OCR-Modell noch gar nicht.
              #
              # Daher Limit über den unlimitierten Highwater (2829Mi) statt
              # über einen Working-Set-Peak. Requests bleiben bei 592Mi:
              # talos-cp1 liegt bei 95 % Memory-Requests, eine Anhebung
              # würde die Schedulebarkeit gefährden — Limits sind ohnehin
              # übercommitted.
              resources:
                requests:
                  cpu: 10m
                  memory: 592Mi
                limits:
                  memory: 3072Mi
      persistence:
        cache:
          enabled: true
          type: emptyDir
          accessMode: ReadWriteMany
