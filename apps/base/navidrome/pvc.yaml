apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data-iscsi
  namespace: navidrome
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-music
  namespace: navidrome
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: nfs-media-static
  volumeName: pv-nfs-navidrome-music
  resources:
    requests:
      storage: 2Ti
