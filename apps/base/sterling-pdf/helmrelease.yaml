apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stirling-pdf-repo
  namespace: flux-system
spec:
  interval: 24h
  url: https://stirling-tools.github.io/Stirling-PDF-chart
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sterling-pdf
  namespace: sterling-pdf
  annotations:
    kustomize.toolkit.fluxcd.io/depends-on: cert-manager.io/Certificate/cert-manager/wildcard-f4mily-net
spec:
  interval: 1h
  timeout: 30m
  # stirling-pdf-chart renders ingress TLS hosts but drops values.ingress.tls.secretName
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: networking.k8s.io
              version: v1
              kind: Ingress
            patch: |
              - op: add
                path: /spec/tls/0/secretName
                value: wildcard-f4mily-net-tls
  install:
    timeout: 30m
    remediation:
      retries: 3
  upgrade:
    timeout: 30m
    remediation:
      retries: 3
  targetNamespace: sterling-pdf
  chart:
    spec:
      chart: stirling-pdf-chart
      version: "3.1.0"
      sourceRef:
        kind: HelmRepository
        name: stirling-pdf-repo
        namespace: flux-system
  values:
    replicaCount: 1
    image:
      repository: stirlingtools/stirling-pdf
      tag: "2.14.3"
    envs:
      - name: DOCKER_ENABLE_SECURITY
        value: "false"
      - name: SECURITY_ENABLELOGIN
        value: "false"
      # The image sizes the heap dynamically from the cgroup limit
      # (STIRLING_JVM_PROFILE=balanced -> -XX:MaxRAMPercentage=65). Compression
      # shells out to Ghostscript, which allocates *outside* the heap but inside
      # the same cgroup, so a 65% heap leaves too little room and the kernel OOM
      # kills the pod mid-`gs`. Cap the heap so native tooling keeps headroom.
      # JAVA_CUSTOM_OPTS is appended after JAVA_BASE_OPTS, so this wins.
      - name: JAVA_CUSTOM_OPTS
        value: "-XX:MaxRAMPercentage=50"
    service:
      type: ClusterIP
      externalPort: 8080
    persistence:
      enabled: true
      storageClass: truenas-iscsi
      accessMode: ReadWriteOnce
      size: 8Gi
      path: /configs
    deployment:
      # Chart bug (3.1.0): templates/deployment.yaml defines the `storage-volume`
      # from the PVC but never renders a matching volumeMount, so /configs stayed
      # ephemeral and settings + the H2 DB were lost on every restart. Mount it
      # ourselves; /configs holds only runtime-generated state, nothing from the
      # image, so shadowing it is safe.
      extraVolumeMounts:
        - name: storage-volume
          mountPath: /configs
    securityContext:
      enabled: true
      fsGroup: 1000
    probes:
      # stirling-pdf takes 2-3 minutes to initialise the JVM + LibreOffice
      # backend on first start. Use a generous startup probe so liveness
      # only kicks in once the app is actually responsive.
      startup:
        enabled: true
        initialDelaySeconds: 60
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 40
      liveness:
        enabled: true
        initialDelaySeconds: 0
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 5
      readiness:
        enabled: true
        initialDelaySeconds: 0
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 10
    resources:
      # 2Gi OOM killed the pod during compression: the JVM alone reached ~1.8Gi
      # (1.3Gi heap + 192m metaspace + native) before Ghostscript even forked.
      # 4Gi with the 50% heap cap above leaves ~1.3Gi for gs/LibreOffice.
      # No CPU limit on purpose - compression is bursty and throttling it only
      # stretches the job out.
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 4Gi
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Sterling PDF
        gethomepage.dev/description: PDF tools
        gethomepage.dev/group: Office
        gethomepage.dev/icon: stirling-pdf.png
        gethomepage.dev/app: stirling-pdf-chart
        # TLS: wildcard-f4mily-net-tls replicated from cert-manager (reflector)
        nginx.org/ssl-redirect: "false"
        nginx.org/redirect-to-https: "true"
        # default client_max_body_size (1m) blocks merging larger PDF sets with 413
        nginx.org/client-max-body-size: "100m"
        nginx.org/proxy-read-timeout: "300"
        nginx.org/proxy-send-timeout: "300"
      hosts:
        - name: pdf.f4mily.net
          path: /
          tls: true
      tls:
        - secretName: wildcard-f4mily-net-tls
          hosts:
            - pdf.f4mily.net
