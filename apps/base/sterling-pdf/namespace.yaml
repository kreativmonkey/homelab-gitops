apiVersion: v1
kind: Namespace
metadata:
  name: sterling-pdf
  # audit/warn bleiben auf baseline: Restricted ist fuer diesen Workload
  # nachweislich blockiert (siehe helmrelease.yaml, securityContext-Kommentar),
  # audit/warn=restricted wuerde nur dauerhaftes Rauschen erzeugen.
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
