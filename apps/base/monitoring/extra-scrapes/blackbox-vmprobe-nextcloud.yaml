# Gleiche URL wie die allgemeine Erreichbarkeitsprobe, aber eigenes Modul:
# es schlägt fehl, solange Nextcloud im Wartungsmodus steht. Wertet der Alert
# NextcloudMaintenanceModeStuck aus.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  name: blackbox-http-nextcloud-online
  namespace: monitoring
  labels:
    release: victoriametrics
spec:
  jobName: blackbox-http-nextcloud-online
  vmProberSpec:
    url: http://prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
  module: http_2xx_nextcloud_online
  targets:
    static:
      targets:
        - https://nc.f4mily.net/status.php
  interval: 30s
