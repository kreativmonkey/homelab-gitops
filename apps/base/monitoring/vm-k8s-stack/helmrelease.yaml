apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-k8s-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 10m
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  postRenderers:
    - kustomize:
        patches:
          # The grafana subchart wires both k8s-sidecar containers
          # (sc-dashboard, sc-datasources) to a single shared
          # `sidecar.resources` values key — no per-sidecar override exists
          # (verified in templates/_pod.tpl of the grafana chart). Since the
          # two containers need different measured values, values: alone
          # cannot express this; patch each container directly by name.
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: vm-k8s-stack-grafana
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: vm-k8s-stack-grafana
              spec:
                template:
                  spec:
                    containers:
                      - name: grafana-sc-dashboard
                        resources:
                          requests:
                            cpu: 10m
                            memory: 96Mi
                          limits:
                            memory: 192Mi
                      - name: grafana-sc-datasources
                        resources:
                          requests:
                            cpu: 10m
                            memory: 80Mi
                          limits:
                            memory: 128Mi
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.90.2"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics-repo
        namespace: flux-system
  values:
    global:
      clusterLabel: cluster

    # ============================================
    # VMCLUSTER - Hochverfügbares Storage
    # ============================================
    vmsingle:
      enabled: false

    vmcluster:
      enabled: true
      spec:
        retentionPeriod: "1"
        vmstorage:
          replicaCount: 2
          priorityClassName: homelab-infrastructure
          podDisruptionBudget:
            # 2 replicas, maxUnavailable 1 → minAvailable 1: one darf während
            # Node-Drain wegfallen, Monitoring-Storage bleibt verfügbar.
            maxUnavailable: 1
          podMetadata:
            annotations:
              backup.velero.io/backup-volumes: vm-data
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: truenas-iscsi
                resources:
                  requests:
                    storage: 20Gi
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 4Gi
        vmselect:
          enabled: true
          replicaCount: 2
          priorityClassName: homelab-infrastructure
          podDisruptionBudget:
            # 2 replicas, maxUnavailable 1 → eine Instanz darf während
            # Node-Drain wegfallen, Query-Path bleibt verfügbar.
            maxUnavailable: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        vminsert:
          enabled: true
          replicaCount: 2
          priorityClassName: homelab-infrastructure
          podDisruptionBudget:
            # 2 replicas, maxUnavailable 1 → eine Instanz darf während
            # Node-Drain wegfallen, Write-Path bleibt verfügbar.
            maxUnavailable: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi

    # ============================================
    # OPERATOR - use quay.io to avoid Docker Hub rate limits
    # ============================================
    victoria-metrics-operator:
      # Avoid install deadlock when operator pod is not up yet (webhook connection refused).
      admissionWebhooks:
        enabled: false
      # p95/p99-derived (14d/7d VictoriaMetrics history), previously unset
      # (Burstable, first-to-be-OOM-killed). No CPU limit by convention.
      resources:
        requests:
          cpu: 50m
          memory: 112Mi
        limits:
          memory: 192Mi
      image:
        registry: quay.io
      env:
        - name: VM_CONFIG_RELOADER_IMAGE
          value: "quay.io/victoriametrics/operator:config-reloader-v0.72.0"
        - name: VM_VMSINGLEDEFAULT_IMAGE
          value: "quay.io/victoriametrics/victoria-metrics"
        - name: VM_VMAGENTDEFAULT_IMAGE
          value: "quay.io/victoriametrics/vmagent"
        - name: VM_VMALERTDEFAULT_IMAGE
          value: "quay.io/victoriametrics/vmalert"
        - name: VM_VMALERTMANAGER_ALERTMANAGERDEFAULTBASEIMAGE
          value: "quay.io/prometheus/alertmanager"

    # ============================================
    # VMAGENT - Scraping & auto-discovery
    # ============================================
    vmagent:
      enabled: true
      spec:
        selectAllByDefault: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 512Mi
        # config-reloader sidecar, injected by the VM operator from this CR
        # field (not a plain Deployment `resources:` — there is no chart
        # values path for it). p95/p99-derived (14d/7d VictoriaMetrics
        # history); already had a 25Mi request (operator default), no limit.
        configReloaderResources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    # ============================================
    # VMALERT - Alerting
    # ============================================
    vmalert:
      enabled: true
      spec:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        # config-reloader sidecar (see vmagent.spec.configReloaderResources comment above).
        configReloaderResources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    # ============================================
    # ALERTMANAGER - ntfy via homelab-monitoring topic
    # ============================================
    alertmanager:
      enabled: true
      # Short name: default generates StatefulSet labels >63 chars (pod create fails)
      name: vm-am
      spec:
        replicaCount: 1
        secrets:
          - alertmanager-ntfy-credentials
          - alertmanager-n8n-webhook
          - alertmanager-homeassistant-webhook
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        # config-reloader sidecar (see vmagent.spec.configReloaderResources comment above).
        configReloaderResources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      config:
        global:
          resolve_timeout: 5m
        route:
          # Drop anything that does not match a child route (info, Watchdog, operator noise, …)
          receiver: blackhole
          group_by: ["alertname", "namespace", "severity", "cluster"]
          group_wait: 2m
          group_interval: 10m
          repeat_interval: 24h
          routes:
            # Dead-Man's-Switch: Dieser Alert feuert permanent (vector(1)) und
            # dient als Herzschlag Richtung Home Assistant. Bleibt er aus, laeuft
            # dort ein Timer ab und HA alarmiert per Mobile-Push - unabhaengig von
            # ntfy, dessen Funktionieren er ja gerade beweisen soll.
            # Muss vor den severity-Routen stehen, sonst greift keine.
            - matchers:
                - alertname="Watchdog"
              receiver: homeassistant-watchdog
              group_wait: 0s
              # group_interval bewusst 1m, nicht 5m: Alertmanager prueft die
              # Wiederholung NUR an group_interval-Ticks. Bei
              # group_interval == repeat_interval verfehlt der erste Tick die
              # Bedingung knapp, und der Herzschlag kommt erst beim zweiten —
              # gemessen 11 statt 5 Minuten. Mit 1m liegt der Takt dort, wo ihn
              # repeat_interval hinlegen soll.
              group_interval: 1m
              repeat_interval: 5m
            # Bypass bridge when it is down (JSON to ntfy — only this alert gets through)
            - matchers:
                - alertname="NtfyBridgeDown"
              receiver: ntfy-emergency
              repeat_interval: 3h
            # Blackbox EndpointDown: notify per endpoint, not as one bundled list.
            # The root group_by lacks `instance`, so every simultaneously-failing probe
            # otherwise collapses into a single ntfy message (whole blast radius instead of
            # the one URL that is down). These two routes mirror the platform fan-out below
            # (n8n-triage + ntfy-monitoring, critical repeat 6h) but grouped by instance, and
            # MUST stay before the generic severity routes so the alert is consumed here and
            # does not fall through (which would re-send it with the bundled grouping).
            - matchers:
                - alertname="EndpointDown"
              group_by: ["alertname", "instance"]
              receiver: n8n-triage
              continue: true
            - matchers:
                - alertname="EndpointDown"
              group_by: ["alertname", "instance"]
              receiver: ntfy-monitoring
              repeat_interval: 6h
            # n8n KI-Triage: Alertmanager → n8n → LLM → Telegram (requires alertmanager-n8n-webhook secret)
            # GitOps auto-PR (webhook/vmalert) is opt-in — see docs/integrations/alerting-n8n-gitops-remediation.md
            - matchers:
                - homelab_owner="platform"
                - severity=~"critical|warning"
              receiver: n8n-triage
              continue: true
            - matchers:
                - severity=critical
              receiver: ntfy-monitoring
              repeat_interval: 6h
            - matchers:
                - severity=warning
              receiver: ntfy-monitoring
              repeat_interval: 24h
        inhibit_rules:
          - source_matchers:
              - severity="critical"
            target_matchers:
              - severity=~"warning|info"
            equal: ["alertname", "namespace", "cluster"]
          - source_matchers:
              - alertname="NodeMemoryCritical"
            target_matchers:
              - alertname="NodeMemoryHigh"
            equal: ["instance", "cluster"]
        receivers:
          - name: ntfy-monitoring
            webhook_configs:
              - url: http://ntfy-bridge.monitoring.svc.cluster.local:8080/
                send_resolved: true
          - name: ntfy-emergency
            webhook_configs:
              - url: https://ntfy.f4mily.net/monitoring
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/vm/secrets/alertmanager-ntfy-credentials/token
          - name: n8n-triage
            webhook_configs:
              - url_file: /etc/vm/secrets/alertmanager-n8n-webhook/url
                send_resolved: true
          - name: homeassistant-watchdog
            webhook_configs:
              - url_file: /etc/vm/secrets/alertmanager-homeassistant-webhook/url
                send_resolved: false
          - name: blackhole

    # ============================================
    # NODE EXPORTER
    # ============================================
    prometheus-node-exporter:
      enabled: true
      # Keep pod bind mounts out, but expose CSI global mounts. Excluding all
      # of /var/lib/kubelet made ext4 emergency_ro remounts invisible.
      extraArgs:
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/pods/.+)($|/)
        - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
      # p95/p99-derived (14d/7d VictoriaMetrics history), previously unset
      # (Burstable, first-to-be-OOM-killed). No CPU limit by convention.
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

    # ============================================
    # KUBE STATE METRICS
    # ============================================
    kube-state-metrics:
      enabled: true
      # Limit = 28d-Peak (107Mi) + 35 %. Vorher 128Mi, also nur 19 % über dem
      # Peak — zu knapp, sobald mehr Objekte im Cluster entstehen (kube-state-
      # metrics skaliert mit der Objektzahl).
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 192Mi
      # Ohne diese Allowlist liefert kube_cronjob_labels NULL Serien und der
      # generische Job-Watchdog (rules/job-watchdog-vmrule.yaml) wäre blind.
      # Bewusst NUR cronjobs -> ~7 Serien. pods=[...] bleibt tabu (Kardinalität).
      metricLabelsAllowlist:
        - cronjobs=[homelab.f4mily.net/watchdog,homelab.f4mily.net/max-age-hours,homelab.f4mily.net/max-runtime-hours]

      # Custom Resource State (CRS): Flux-Reconcile-Metriken.
      #
      # gotk_reconcile_condition/gotk_suspend_status existieren in Flux 2.9
      # nicht mehr (siehe docs/runbooks/flux-reconcile.md, Abschnitt "gotk_*
      # ist tot"). Statt der Controller-Metrik generiert kube-state-metrics
      # die Serien jetzt direkt aus den Flux-CRs. Syntax verifiziert gegen
      # https://github.com/kubernetes/kube-state-metrics/blob/main/docs/metrics/extend/customresourcestate-metrics.md
      # (Beispiel "status conditions on Kubernetes Controllers") sowie gegen
      # `helm template` — siehe just-validate-Output für den Beleg, dass diese
      # Config tatsächlich in den ConfigMap-Values landet.
      #
      # Metriken je abgedecktem Kind (Kustomization, HelmRelease,
      # GitRepository, OCIRepository, HelmRepository, HelmChart):
      #   flux_resource_ready{namespace,name,kind,type,status}  Info, Wert immer 1
      #     -> eine Serie je Eintrag in .status.conditions[], nicht nur für
      #        "Ready". Alert-Queries filtern deshalb explizit type="Ready".
      #   flux_resource_suspended{namespace,name,kind}          Gauge, 0/1
      #     -> aus .spec.suspend (bool wird von KSM zu 0.0/1.0).
      #
      # WICHTIG, nicht vereinfachen: status steht als LABEL, nicht als
      # Metrikwert. Ein Gauge mit valueFrom:[status] würde "False" UND
      # "Unknown" beide auf 0.0 abbilden (KSM-String-Konvertierung: alles
      # außer "true"/"yes" -> 0.0) — genau die Unterscheidung, die am
      # 14.08.2026 zwischen Ursache (Unknown) und Folgefehlern (False) den
      # Unterschied machte, ginge damit verloren. Deshalb Info-Metrik mit
      # type+status als Label statt Gauge mit valueFrom.
      #
      # Diese Metriken kommen über die Default-VMServiceScrape von
      # kube-state-metrics selbst rein (values-Key `vmScrape`, oben im Chart
      # bereits mit honorLabels:true aktiv) — kein separater Scrape nötig.
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: flux
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                commonLabels:
                  kind: Kustomization
                metrics:
                  - name: resource_ready
                    help: "Ready-Bedingung eines Flux-Objekts (Info-Metrik, Wert immer 1; status als Label)."
                    each:
                      type: Info
                      info:
                        path: [status, conditions]
                        labelsFromPath:
                          type: ["type"]
                          status: ["status"]
                  - name: resource_suspended
                    help: "spec.suspend eines Flux-Objekts (0=aktiv, 1=suspendiert)."
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, suspend]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: flux
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                commonLabels:
                  kind: HelmRelease
                metrics:
                  - name: resource_ready
                    help: "Ready-Bedingung eines Flux-Objekts (Info-Metrik, Wert immer 1; status als Label)."
                    each:
                      type: Info
                      info:
                        path: [status, conditions]
                        labelsFromPath:
                          type: ["type"]
                          status: ["status"]
                  - name: resource_suspended
                    help: "spec.suspend eines Flux-Objekts (0=aktiv, 1=suspendiert)."
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: flux
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                commonLabels:
                  kind: GitRepository
                metrics:
                  - name: resource_ready
                    help: "Ready-Bedingung eines Flux-Objekts (Info-Metrik, Wert immer 1; status als Label)."
                    each:
                      type: Info
                      info:
                        path: [status, conditions]
                        labelsFromPath:
                          type: ["type"]
                          status: ["status"]
                  - name: resource_suspended
                    help: "spec.suspend eines Flux-Objekts (0=aktiv, 1=suspendiert)."
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: flux
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                commonLabels:
                  kind: OCIRepository
                metrics:
                  - name: resource_ready
                    help: "Ready-Bedingung eines Flux-Objekts (Info-Metrik, Wert immer 1; status als Label)."
                    each:
                      type: Info
                      info:
                        path: [status, conditions]
                        labelsFromPath:
                          type: ["type"]
                          status: ["status"]
                  - name: resource_suspended
                    help: "spec.suspend eines Flux-Objekts (0=aktiv, 1=suspendiert)."
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: flux
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                commonLabels:
                  kind: HelmRepository
                metrics:
                  - name: resource_ready
                    help: "Ready-Bedingung eines Flux-Objekts (Info-Metrik, Wert immer 1; status als Label)."
                    each:
                      type: Info
                      info:
                        path: [status, conditions]
                        labelsFromPath:
                          type: ["type"]
                          status: ["status"]
                  - name: resource_suspended
                    help: "spec.suspend eines Flux-Objekts (0=aktiv, 1=suspendiert)."
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: flux
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                commonLabels:
                  kind: HelmChart
                metrics:
                  - name: resource_ready
                    help: "Ready-Bedingung eines Flux-Objekts (Info-Metrik, Wert immer 1; status als Label)."
                    each:
                      type: Info
                      info:
                        path: [status, conditions]
                        labelsFromPath:
                          type: ["type"]
                          status: ["status"]
                  - name: resource_suspended
                    help: "spec.suspend eines Flux-Objekts (0=aktiv, 1=suspendiert)."
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, suspend]

      # Ohne List/Watch auf die Flux-CRDs liefert die CRS-Config oben still
      # keine Daten — kein Fehler, einfach leere Metriken (Belegpflicht siehe
      # just-validate-Output). rbac.customResourceState.createClusterRoleRules
      # gibt es in dieser Chart-Version (kube-state-metrics 7.5.3, gebündelt
      # in victoria-metrics-k8s-stack 0.90.1) noch NICHT (geprüft mit
      # `helm show values` gegen die tatsächlich gepinnte Version) — der
      # Weg für Custom-Resource-RBAC ist hier ausschließlich rbac.extraRules.
      rbac:
        extraRules:
          - apiGroups: ["kustomize.toolkit.fluxcd.io"]
            resources: ["kustomizations"]
            verbs: ["list", "watch"]
          - apiGroups: ["helm.toolkit.fluxcd.io"]
            resources: ["helmreleases"]
            verbs: ["list", "watch"]
          - apiGroups: ["source.toolkit.fluxcd.io"]
            resources:
              - gitrepositories
              - ocirepositories
              - helmrepositories
              - helmcharts
            verbs: ["list", "watch"]

    # ============================================
    # DEFAULT DASHBOARDS & RULES
    # ============================================
    defaultDashboards:
      enabled: true

    # Chart defaults (~100+ rules) are too noisy for a homelab; use platform P0 VMRules only.
    # Template checks `enabled` first (chart default: true). `create: false` alone leaves ~39 rules.
    defaultRules:
      create: false
      enabled: false

    # ============================================
    # GRAFANA
    # ============================================
    grafana:
      enabled: true

      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-username
        passwordKey: admin-password

      # Recreate avoids RWO PVC deadlock on upgrades
      deploymentStrategy:
        type: Recreate

      # Persistence - reuse existing PVC
      persistence:
        enabled: true
        storageClassName: truenas-iscsi
        size: 2Gi

      # Align securityContext with podSecurityContext: chart init-chown uses
      # securityContext.runAsUser (default 472), not podSecurityContext — mismatch
      # caused CrashLoop (init chown 472, main container UID 1000).
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      podSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initChownData:
        enabled: false

      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      # emptyDir volumes needed for readOnlyRootFilesystem + plugin installer
      extraVolumes:
        - name: tmp
          emptyDir: {}
        - name: plugins-dir
          emptyDir: {}
        - name: logs
          emptyDir: {}

      extraVolumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: plugins-dir
          mountPath: /var/lib/grafana/plugins
        - name: logs
          mountPath: /var/log/grafana

      # Native VictoriaMetrics datasource plugin (must exist on grafana.com/plugins catalog)
      # 0.25.x is not published to the catalog yet → Grafana exits on plugin install failure
      plugins:
        # renovate: datasource=custom.grafana-plugins depName=victoriametrics-metrics-datasource
        - victoriametrics-metrics-datasource@0.25.0
        # renovate: datasource=custom.grafana-plugins depName=victoriametrics-logs-datasource
        - victoriametrics-logs-datasource@0.29.0

      priorityClassName: homelab-infrastructure

      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

      # Give grafana time to download and install the VM plugin before health checks
      readinessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 5
        failureThreshold: 10
      livenessProbe:
        initialDelaySeconds: 120
        timeoutSeconds: 10
        failureThreshold: 10

      ingress:
        enabled: false

      # Generic OAuth via Authentik (login.f4mily.net, application slug: grafana-talos-cluster)
      # Requires Secret grafana-authentik-oauth — create with: just grafana-authentik-oauth
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
          secretKeyRef:
            name: grafana-authentik-oauth
            key: client-id
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-authentik-oauth
            key: client-secret
      grafana.ini:
        server:
          root_url: https://grafana.cluster.f4mily.net
        users:
          auto_assign_org: true
          auto_assign_org_role: Viewer
        auth:
          signout_redirect_url: https://login.f4mily.net/application/o/grafana-talos-cluster/end-session/
        auth.generic_oauth:
          enabled: true
          name: Authentik
          scopes: openid profile email entitlements
          # Authentik: authorize/token/userinfo sind global (nicht slug-scoped),
          # nur end-session trägt den Application-Slug.
          auth_url: https://login.f4mily.net/application/o/authorize/
          token_url: https://login.f4mily.net/application/o/token/
          api_url: https://login.f4mily.net/application/o/userinfo/
          allow_sign_up: true
          use_pkce: true
          role_attribute_path: >-
            contains(entitlements[*], 'Grafana Admins') && 'Admin' ||
            contains(entitlements[*], 'Grafana Editors') && 'Editor' ||
            'Viewer'
          allow_assign_grafana_admin: true

      podAnnotations:
        backup.velero.io/backup-volumes: grafana-storage

      # Der Datasource-Sidecar ist der EINZIGE Provisioning-Weg dieses Charts
      # (templates/grafana/datasource.yaml rendert nur mit aktiviertem
      # Sidecar). Ohne ihn verwalten die Values gar keine Datasources und in
      # Grafanas DB veralten die zuletzt provisionierten Einträge — so
      # geschehen bei der vmcluster-Migration: Dashboards zeigten "no such
      # host" auf den toten vmsingle-Service.
      sidecar:
        datasources:
          enabled: true
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"

    # ============================================
    # DATASOURCE - chart manages this natively
    # ============================================
    # Chart-Defaults provisionieren uid=VictoriaMetrics (prometheus, Default)
    # und uid=VictoriaMetricsDS (natives VM-Plugin) mit der zum Topologie-
    # Modus (vmsingle/vmcluster) passenden URL; Alertmanager kommt ebenfalls
    # automatisch. Die Dashboards des Charts referenzieren uid=VictoriaMetrics.
    defaultDatasources:
      # VictoriaLogs ist ein eigenes HelmRelease — seine URL kennt der Chart
      # nicht, daher explizit als Extra-Datasource.
      extra:
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          access: proxy
          uid: VictoriaLogs
          url: http://victoria-logs-single-server.monitoring.svc.cluster.local:9428
          jsonData:
            maxLines: 1000

    # ============================================
    # KUBELET SCRAPING
    # ============================================
    kubelet:
      enabled: true
      spec:
        interval: 30s

    # ============================================
    # KUBE API SERVER SCRAPING
    # ============================================
    # Talos: per-node apiserver Endpoints often look down from vmagent → TargetDown noise.
    kubeApiServer:
      enabled: false

    # ============================================
    # KUBE CONTROLLER MANAGER
    # ============================================
    # Talos: control-plane metrics are not reachable via standard Endpoints scrape.
    kubeControllerManager:
      enabled: false

    # ============================================
    # KUBE SCHEDULER
    # ============================================
    kubeScheduler:
      enabled: false

    # ============================================
    # KUBE ETCD
    # ============================================
    kubeEtcd:
      enabled: false

    # ============================================
    # KUBE PROXY
    # ============================================
    kubeProxy:
      enabled: false
