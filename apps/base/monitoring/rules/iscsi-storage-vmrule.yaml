# Cluster-side storage alerts that complement the ZFS-side truenas-vmrule.
# The recurring iSCSI cascade (FastStorage SSD shared with other Proxmox VMs)
# surfaces as initiator-side write-latency spikes / -EIO and a CNPG failover
# storm, while TrueNAS' own ZFS error counters stay 0 — so these are detected
# here, on the nodes and CNPG, not on the NAS.
# `homelab_owner: platform` routes to ntfy + n8n triage.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab-iscsi-storage
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: homelab-monitoring
    homelab/owner: platform
spec:
  groups:
    - name: homelab.platform.iscsi
      interval: 30s
      rules:
        - alert: IScsiEmergencyReadOnly
          # Faengt nur den Fall ab, in dem woertlich `ro` in den Mount-Optionen
          # steht — also einen sauber read-only gemounteten Mount.
          # ACHTUNG: Der haeufigere Fall, das vom Kernel abgeschaltete
          # Dateisystem (`emergency_ro`), kippt diese Serie NICHT; er laeuft
          # ueber FilesystemShutdown weiter unten. Beide Regeln braucht es.
          expr: |
            node_filesystem_readonly{
              fstype=~"ext4|xfs",
              mountpoint=~"/var/lib/kubelet/plugins/kubernetes.io/csi/.+/globalmount"
            } == 1
          for: 2m
          labels:
            severity: critical
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "iSCSI-Dateisystem read-only: {{ $labels.device }}"
            description: "{{ $labels.mountpoint }} auf {{ $labels.instance }} ist read-only. Workload stoppen und Dateisystem offline prüfen; nicht im laufenden Betrieb reparieren."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/nextcloud-init-crashloop.md"

        - alert: FilesystemShutdown
          # Der Fall, der am 24.08.2026 36h unbemerkt blieb: ext4 setzt nach
          # einem I/O-Fehler `emergency_ro`, laesst die Mount-Optionen aber auf
          # `rw` stehen. node_filesystem_readonly bleibt deshalb 0, waehrend
          # kein Schreibvorgang mehr durchgeht. Quelle ist der fs-health-
          # exporter (DaemonSet), der /proc/1/mounts direkt auswertet.
          expr: node_fs_shutdown == 1
          for: 2m
          labels:
            severity: critical
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "Dateisystem abgeschaltet: {{ $labels.device }} auf {{ $labels.node }}"
            description: "Der Kernel hat {{ $labels.device }} ({{ $labels.fstype }}, Volume {{ $labels.volume }}) auf {{ $labels.node }} abgeschaltet — Schreibzugriffe schlagen fehl, obwohl der Mount als rw gilt. Workload stoppen, Volume offline fsck'en; ein Pod-Neustart allein heilt das nicht."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/nextcloud-init-crashloop.md"

        - alert: Ext4FilesystemErrorsPending
          # errors_count ist persistent und ueberlebt Remounts wie Reboots —
          # erst ein fsck setzt ihn zurueck. Ein Wert > 0 heisst deshalb:
          # dieses Volume traegt unreparierten Schaden, auch wenn es gerade
          # wieder schreibbar aussieht.
          expr: node_fs_ext4_errors_count > 0
          for: 30m
          labels:
            severity: warning
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "ext4-Fehler unrepariert: {{ $labels.device }} auf {{ $labels.node }}"
            description: "{{ $labels.device }} (Volume {{ $labels.volume }}) auf {{ $labels.node }} hat {{ $value }} unreparierte ext4-Fehler. Der Zaehler bleibt bis zu einem offline e2fsck stehen — Wartungsfenster einplanen."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/nextcloud-init-crashloop.md"

        - alert: NodeISCSIDiskWriteLatencyHigh
          # Avg write service time per op on the iSCSI block devices (sd*). Baseline ~1ms;
          # >250ms sustained means the initiator is waiting on the contended SSD/transport,
          # the precursor to FUA-write timeouts (-EIO) that abort Postgres. clamp_min keeps
          # idle/low-write devices (ratio ~0) from producing noise.
          expr: |
            rate(node_disk_write_time_seconds_total{device=~"sd.*"}[5m])
              / clamp_min(rate(node_disk_writes_completed_total{device=~"sd.*"}[5m]), 1)
              > 0.25
          # 3m statt 10m: am 24.08.2026 lief der Stall, der ext4 abgeschaltet
          # hat, keine 10 Minuten — der Kernel gab den Write nach 180s auf.
          # Die Regel kam dadurch nur bis `pending` und hat nie alarmiert.
          for: 3m
          labels:
            severity: warning
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "Hohe iSCSI-Write-Latenz: {{ $labels.instance }} {{ $labels.device }}"
            description: "Avg Write-Latenz {{ $value | humanizeDuration }}/op auf {{ $labels.device }} ({{ $labels.instance }}) seit 10m > 250ms (Baseline ~1ms). Deutet auf SSD-/iSCSI-Contention (shared FastStorage) — die Ursache, die die ZFS-Fehler-Counter NICHT sehen. Proxmox-seitig I/O der anderen VMs prüfen."

        - alert: CNPGPostgresFlapping
          # >=3 restarts in 15min on a CNPG postgres instance = the failover-cascade
          # signature (iSCSI stall -> -EIO -> abort -> failover; DB-backed apps flap with it).
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="cnpg-system", container="postgres"}[15m]) >= 3
          for: 2m
          labels:
            severity: warning
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "CNPG-Instanz {{ $labels.pod }} flappt ({{ $value }} Restarts/15m)"
            description: "{{ $labels.pod }} hat in 15min >= 3 Restarts — typische iSCSI-Contention-Failover-Kaskade. Korreliert mit NodeISCSIDiskWriteLatencyHigh; ZFS-Counter bleiben dabei 0. Echter Fix = dedizierte DB-SSD."
