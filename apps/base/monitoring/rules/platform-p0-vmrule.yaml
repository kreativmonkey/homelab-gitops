apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab-platform-p0
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: homelab-monitoring
    homelab/owner: platform
spec:
  groups:
    - name: homelab.platform.cnpg
      interval: 30s
      rules:
        - alert: CNPGClusterOffline
          expr: |
            (count(cnpg_collector_up{namespace="cnpg-system"}) or on() vector(0)) == 0
          for: 5m
          labels:
            severity: critical
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "CNPG: keine Metriken in cnpg-system"
            description: "Der CNPG-Exporter liefert seit 5 Minuten keine Daten. Datenbank-Apps können betroffen sein."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/cnpg-cluster-offline.md"

        - alert: CNPGClusterInstanceDown
          expr: cnpg_collector_up{namespace="cnpg-system"} == 0
          for: 5m
          labels:
            severity: critical
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "CNPG-Instanz {{ $labels.pod }} offline"
            description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} meldet cnpg_collector_up=0."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/cnpg-cluster-offline.md"

        - alert: CNPGBackupStale
          expr: |
            (
              time() - cnpg_collector_last_available_backup_timestamp{namespace="cnpg-system"}
            ) > 50 * 3600
            and
              cnpg_collector_last_available_backup_timestamp{namespace="cnpg-system"} > 0
          for: 1h
          labels:
            severity: warning
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "CNPG-Backup veraltet: {{ $labels.cluster }}"
            description: "Letztes verfügbares Backup für Cluster {{ $labels.cluster }} ist älter als 50 Stunden."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/cnpg-backup-stale.md"

    - name: homelab.platform.velero
      interval: 30s
      rules:
        - alert: VeleroMetricsAbsent
          expr: (count(velero_backup_total) or on() vector(0)) == 0
          for: 10m
          labels:
            severity: critical
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "Velero-Metriken fehlen"
            description: "Velero wird seit 10 Minuten nicht gescraped; Backup-Alerts sind blind."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/velero-backup.md"

        - alert: VeleroBackupFailures
          expr: |
            increase(velero_backup_failure_total[1h]) > 0
            or
            increase(velero_backup_partial_failure_total[1h]) > 0
          for: 5m
          labels:
            severity: warning
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "Velero-Backup fehlerhaft: {{ $labels.schedule }}"
            description: "In der letzten Stunde ist ein Velero-Backup fehlgeschlagen oder nur teilweise gelungen."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/velero-backup.md"

        - alert: VeleroBackupNeverSucceeded
          expr: |
            absent(velero_backup_last_successful_timestamp{schedule!=""})
            and on()
            velero_backup_total >= 0
          for: 30m
          labels:
            severity: critical
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "Velero: noch kein erfolgreiches Schedule-Backup"
            description: "Velero liefert Metriken, aber keinen erfolgreichen Backup-Zeitstempel."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/velero-backup.md"

        # Die Schwelle muss zum Schedule passen. Eine gemeinsame 36h-Schwelle
        # fuer alle Schedules liess `weekly-backup` zwangslaeufig taeglich
        # alarmieren (Intervall 7d > 36h) — der Alarm feuerte an ~5 von 7 Tagen
        # ohne Defekt und hat echte Meldungen zugedeckt.
        - alert: VeleroBackupStale
          expr: (time() - velero_backup_last_successful_timestamp{schedule="daily-backup"}) > 36 * 3600
          for: 1h
          labels:
            severity: warning
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "Velero: kein erfolgreiches Daily-Backup seit 36h"
            description: "Schedule {{ $labels.schedule }} — letzter Erfolg zu lange her (Intervall 24h, Schwelle 36h)."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/velero-backup.md"

        - alert: VeleroWeeklyBackupStale
          expr: (time() - velero_backup_last_successful_timestamp{schedule="weekly-backup"}) > 9 * 24 * 3600
          for: 1h
          labels:
            severity: warning
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "Velero: kein erfolgreiches Weekly-Backup seit 9 Tagen"
            description: "Schedule {{ $labels.schedule }} — letzter Erfolg zu lange her (Intervall 7d, Schwelle 9d)."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/velero-backup.md"

        # Faengt jeden kuenftigen Schedule ab, der oben nicht namentlich steht —
        # sonst waere ein neuer Schedule stillschweigend unueberwacht.
        # schedule!="" ist zwingend: Velero exportiert die Serie auch ohne
        # schedule-Label fuer manuell ausgeloeste Backups. Ein fehlendes Label
        # gilt in PromQL als "" und matcht den Negativ-Matcher — ohne diesen
        # Ausschluss feuert der Alert nach jedem Ad-hoc-Backup dauerhaft, weil
        # ein einmaliges Backup per Definition nie wieder "aktuell" wird.
        - alert: VeleroUnknownScheduleStale
          expr: (time() - velero_backup_last_successful_timestamp{schedule!="", schedule!~"daily-backup|weekly-backup"}) > 36 * 3600
          for: 1h
          labels:
            severity: warning
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "Velero: Schedule {{ $labels.schedule }} ohne Erfolg seit 36h"
            description: "Schedule {{ $labels.schedule }} hat keine eigene Schwelle in der VMRule. Passende Schwelle ergaenzen oder Ursache prüfen."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/velero-backup.md"

    - name: homelab.platform.nodes
      interval: 30s
      rules:
        - alert: NodeMemoryCritical
          expr: |
            (
              node_memory_MemAvailable_bytes
              / node_memory_MemTotal_bytes
            ) < 0.10
          for: 10m
          labels:
            severity: critical
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "Node {{ $labels.instance }}: Speicher kritisch (<10 % frei)"
            description: "Verfügbarer RAM unter 10 % seit 10 Minuten."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/node-resources.md"

        - alert: NodeDiskCritical
          expr: |
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint!=""}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint!=""}
            ) < 0.10
          for: 15m
          labels:
            severity: critical
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "Node {{ $labels.instance }}: Disk {{ $labels.mountpoint }} <10 % frei"
            description: "Filesystem fast voll — Longhorn/CNPG/VM-Daten prüfen."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/node-resources.md"

    - name: homelab.platform.monitoring
      interval: 30s
      rules:
        - alert: MonitoringVMAlertDown
          expr: up{job=~".*vmalert.*"} == 0
          for: 2m
          labels:
            severity: critical
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "VMAlert scrape down ({{ $labels.job }})"
            description: "Alert-Auswertung ausgefallen — es werden ggf. keine neuen Alerts erzeugt."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/monitoring-stack.md"

        - alert: MonitoringAlertmanagerDown
          expr: up{job=~".*alertmanager.*"} == 0
          for: 2m
          labels:
            severity: critical
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "Alertmanager scrape down ({{ $labels.job }})"
            description: "Benachrichtigungen nach ntfy werden nicht zugestellt."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/monitoring-stack.md"

        - alert: NtfyBridgeDown
          expr: |
            kube_deployment_spec_replicas{namespace="monitoring", deployment="ntfy-bridge"}
            != kube_deployment_status_replicas_available{namespace="monitoring", deployment="ntfy-bridge"}
          for: 2m
          labels:
            severity: critical
            cluster: homelab
            homelab_owner: platform
            homelab/auto_triage: "true"
          annotations:
            summary: "ntfy-bridge nicht verfügbar"
            description: "Alertmanager kann keine lesbaren ntfy-Nachrichten zustellen. Andere Alerts erscheinen erst in AM/Grafana bis die Bridge wieder läuft."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/monitoring-stack.md"
