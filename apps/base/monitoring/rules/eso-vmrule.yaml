apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: external-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: homelab-monitoring
    homelab/owner: platform
spec:
  groups:
    - name: homelab.platform.eso
      rules:
        - alert: ExternalSecretsOperatorUnavailable
          expr: |
            absent(up{service="external-secrets-metrics",namespace="external-secrets"} == 1)
          for: 15m
          labels:
            severity: warning
            homelab_owner: platform
          annotations:
            summary: "External Secrets Operator liefert keine Metriken"
            description: "Prüfe HelmRelease, Controller-Pod und Scrape-Ziel im Namespace external-secrets."
        - alert: ExternalSecretSyncFailed
          expr: |
            externalsecret_status_condition{condition="Ready",status="False"} == 1
          for: 15m
          labels:
            severity: warning
            homelab_owner: platform
          annotations:
            summary: "ExternalSecret kann nicht synchronisieren"
            description: "Prüfe Ready-Condition, SecretStore und Quell-Secret. Bestehende Kopien können veraltet sein."
        - alert: DatabaseSourceSecretMissing
          # CreatedOnce with Orphan can remain Ready after its target disappears.
          expr: |
            absent(kube_secret_info{namespace="secret-source",secret="db-hister"})
            or absent(kube_secret_info{namespace="secret-source",secret="db-vikunja"})
            or absent(kube_secret_info{namespace="secret-source",secret="db-ainsel"})
            or absent(kube_secret_info{namespace="secret-source",secret="db-authentik"})
            or absent(kube_secret_info{namespace="secret-source",secret="db-dawarich"})
            or absent(kube_secret_info{namespace="secret-source",secret="db-forgejo"})
            or absent(kube_secret_info{namespace="secret-source",secret="db-goloom"})
            or absent(kube_secret_info{namespace="secret-source",secret="db-immich"})
            or absent(kube_secret_info{namespace="secret-source",secret="db-outline"})
            or absent(kube_secret_info{namespace="secret-source",secret="db-paperless"})
            or absent(kube_secret_info{namespace="secret-source",secret="db-sparkyfitness"})
            or absent(kube_secret_info{namespace="secret-source",secret="db-sparkyfitness-app"})
            or absent(kube_secret_info{namespace="secret-source",secret="db-tandoor"})
            or absent(kube_secret_info{namespace="secret-source",secret="db-teslamate"})
          for: 15m
          labels:
            severity: warning
            homelab_owner: platform
          annotations:
            summary: "DB-Quell-Secret {{ $labels.secret }} fehlt"
            description: "Stelle secret-source/{{ $labels.secret }} mit dem ursprünglichen Wert aus Velero wieder her, bevor du das ExternalSecret neu anlegst."
        - alert: AppSourceSecretMissing
          # ESO can remain Ready after a CreatedOnce/Orphan target disappears.
          expr: |
            absent(kube_secret_info{namespace="secret-source",secret="searxng-key"})
          for: 15m
          labels:
            severity: warning
            homelab_owner: platform
          annotations:
            summary: "App-Quell-Secret {{ $labels.secret }} fehlt"
            description: "Stelle secret-source/{{ $labels.secret }} mit dem ursprünglichen Wert aus dem Backup wieder her, bevor du das ExternalSecret neu anlegst."
