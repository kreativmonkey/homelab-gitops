# Alerting-Regeln für Blackbox-Exporter-Prüfungen (Erreichbarkeit + SSL).
# $labels.instance enthält die geprüfte URL (z. B. https://nextcloud.deinedomain.local).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab-blackbox
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: homelab-monitoring
    homelab/owner: platform
spec:
  groups:
    - name: homelab.blackbox.ingress
      interval: 30s
      rules:
        - alert: EndpointDown
          expr: probe_success == 0
          for: 2m
          labels:
            severity: critical
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "Blackbox-Probe fehlgeschlagen: {{ $labels.instance }}"
            description: "Der Endpunkt {{ $labels.instance }} ist nicht erreichbar oder antwortet mit einem Fehlerstatus. HTTP/SSL-Prüfung fehlgeschlagen."

        - alert: SSLCertExpiringSoon
          expr: probe_ssl_earliest_cert_expiry - time() < 7 * 24 * 3600 and probe_success == 1
          for: 5m
          labels:
            severity: warning
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "SSL-Zertifikat läuft bald ab: {{ $labels.instance }}"
            description: "Das SSL-Zertifikat für {{ $labels.instance }} läuft in weniger als 7 Tagen ab. Läuft ab am {{ $value | humanizeTimestamp }}."

        # Wartungsmodus aktiv, während Nextcloud erreichbar ist — ein echter
        # Ausfall meldet stattdessen EndpointDown. Die Wartezeit liegt deutlich
        # über dem Wartungsfenster des Offsite-Backups.
        - alert: NextcloudMaintenanceModeStuck
          expr: |
            probe_success{job="blackbox-http-nextcloud-online"} == 0
            and on(instance)
            probe_success{job="blackbox-http"} == 1
          for: 30m
          labels:
            severity: warning
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "Nextcloud hängt im Wartungsmodus"
            description: "nc.f4mily.net meldet seit 30 Minuten maintenance=true, ist dabei aber erreichbar. Ein regulärer Offsite-Backup-Lauf sperrt Nextcloud nur wenige Minuten. Freigabe: kubectl exec -n nextcloud deploy/nextcloud -c nextcloud -- php occ maintenance:mode --off"
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/offsite-backup-restore.md"
