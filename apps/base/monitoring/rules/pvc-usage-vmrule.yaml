# PVC-Füllstand-Alerts. Disk-full ist die häufigste Homelab-Ausfallart —
# besonders fatal bei node-local `local-path` unter CNPG: ein volles Volume
# blockiert den WAL-Write und die DB geht offline. Live fehlten diese Regeln,
# während immich-CNPG Aug 15–18 drei Nächte hintereinander das Nightly-Backup
# verfehlte — der Backup-stale-Alert zog zwar, das Volume-Wachstum wurde aber
# nicht früh genug sichtbar.
# `homelab_owner: platform` routet zu ntfy + n8n-Triage.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab-pvc-usage
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: homelab-monitoring
    homelab/owner: platform
spec:
  groups:
    - name: homelab.platform.pvc
      interval: 1m
      rules:
        # Per-volume stats are reliable for democratic-csi iSCSI volumes.
        # Static local PVs and NFS paths can report their shared filesystem,
        # while local-path hostPath volumes do not expose kubelet volume stats.
        - alert: PVCDiskSpaceLow
          # Keep existing thresholds, but only evaluate per-volume iSCSI stats.
          expr: |
            (
              kubelet_volume_stats_available_bytes
                / kubelet_volume_stats_capacity_bytes
            ) * 100 < 15
            and on(namespace, persistentvolumeclaim)
              kube_persistentvolumeclaim_info{storageclass="truenas-iscsi"}
          for: 15m
          labels:
            severity: warning
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} fast voll ({{ $value | printf \"%.1f\" }} % frei)"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} hat nur noch {{ $value | printf \"%.1f\" }} % frei (< 15 %). Ein volles Volume kann schreibende Workloads blockieren. Volume prüfen und Daten aufräumen, bevor critical greift."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/pvc-disk-space.md"

        - alert: PVCDiskSpaceCritical
          # freier Anteil < 5 % — akute Gefahr von Disk-full / WAL-Stall.
          expr: |
            (
              kubelet_volume_stats_available_bytes
                / kubelet_volume_stats_capacity_bytes
            ) * 100 < 5
            and on(namespace, persistentvolumeclaim)
              kube_persistentvolumeclaim_info{storageclass="truenas-iscsi"}
          for: 5m
          labels:
            severity: critical
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} kritisch voll ({{ $value | printf \"%.1f\" }} % frei)"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} hat nur noch {{ $value | printf \"%.1f\" }} % frei (< 5 %). Schreibende Workloads können jeden Moment blockieren. Volume prüfen und Daten sofort aufräumen."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/pvc-disk-space.md"

        - alert: PVCDiskSpaceGrowthForecast
          # Nur große Volumes (> 50 Gi) betrachten: linearer Fit über 1d,
          # extrapoliert auf 7d. Trifft die Kapazität in 7d -> früher Warn.
          # Verhindert Überraschung durch stetiges Wachstum (z.B. Immich/Nextcloud).
          expr: |
            (
              kubelet_volume_stats_capacity_bytes > 50 * 1024 * 1024 * 1024
            )
            and
            (
              predict_linear(kubelet_volume_stats_used_bytes[1d], 7 * 24 * 3600)
                > kubelet_volume_stats_capacity_bytes
            )
            and on(namespace, persistentvolumeclaim)
              kube_persistentvolumeclaim_info{storageclass="truenas-iscsi"}
          for: 1h
          labels:
            severity: warning
            cluster: homelab
            homelab_owner: platform
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} wächst Richtung Limit"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} ({{ $value | humanize1024 }} Kapazität) erreicht bei aktuellem Wachstum in ~7d sein Limit. Volume und Wachstum prüfen, bevor PVCDiskSpaceLow greift."
            runbook_url: "https://git.f4mily.net/homelab/gitops-homelab/blob/main/docs/runbooks/pvc-disk-space.md"
