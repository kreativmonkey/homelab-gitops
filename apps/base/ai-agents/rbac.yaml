# External MCP clients authenticate as separate ServiceAccounts.
# Namespace-specific permissions are declared beside the workload they serve.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-agents-cluster-read
rules:
  # Ergänzt die Built-in-Rolle "view" um cluster-weite Objekte,
  # die view nicht abdeckt (Nodes, Namespaces, PVs, StorageClasses, CRDs).
  - apiGroups:
      - ""
    resources:
      - nodes
      - namespaces
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-laptop
  namespace: ai-agents
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-laptop-token
  namespace: ai-agents
  annotations:
    kubernetes.io/service-account.name: mcp-laptop
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agents-view-laptop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: mcp-laptop
    namespace: ai-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agents-cluster-read-laptop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-agents-cluster-read
subjects:
  - kind: ServiceAccount
    name: mcp-laptop
    namespace: ai-agents
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-openclaw
  namespace: ai-agents
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-openclaw-token
  namespace: ai-agents
  annotations:
    kubernetes.io/service-account.name: mcp-openclaw
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-hermes
  namespace: ai-agents
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-hermes-token
  namespace: ai-agents
  annotations:
    kubernetes.io/service-account.name: mcp-hermes
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agents-view-openclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: mcp-openclaw
    namespace: ai-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agents-cluster-read-openclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-agents-cluster-read
subjects:
  - kind: ServiceAccount
    name: mcp-openclaw
    namespace: ai-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agents-view-hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: mcp-hermes
    namespace: ai-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-agents-cluster-read-hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-agents-cluster-read
subjects:
  - kind: ServiceAccount
    name: mcp-hermes
    namespace: ai-agents
