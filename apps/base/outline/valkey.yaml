# Valkey provides queues, pub/sub and caching for Outline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline-valkey
  namespace: outline
  labels:
    app.kubernetes.io/name: outline-valkey
    app.kubernetes.io/part-of: outline
spec:
  replicas: 1
  # Remove the old replica from service before adding the new queue backend.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outline-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline-valkey
        app.kubernetes.io/part-of: outline
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          # Pinned by digest to a released ghcr.io/valkey-io/valkey image (7.2.9).
          image: ghcr.io/valkey-io/valkey@sha256:4a454e64f8df60b164e1407bceca31d7b65d0e654b8f9354b313a497b6904a73
          imagePullPolicy: IfNotPresent
          args:
            - valkey-server
            - --aclfile
            - /etc/valkey/acl/users.acl
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: acl
              mountPath: /etc/valkey/acl
              readOnly: true
            # Valkey needs a writable tmp dir under readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: acl
          secret:
            secretName: outline-valkey-eso
            items:
              - key: users.acl
                path: users.acl
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: outline-valkey
  namespace: outline
  labels:
    app.kubernetes.io/name: outline-valkey
    app.kubernetes.io/part-of: outline
spec:
  selector:
    app.kubernetes.io/name: outline-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
