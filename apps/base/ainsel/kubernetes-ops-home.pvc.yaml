apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubernetes-ops-home
  namespace: ainsel
  labels:
    app.kubernetes.io/name: ainsel
    app.kubernetes.io/component: subscription-home
spec:
  accessModes:
    - ReadWriteOncePod
  storageClassName: truenas-iscsi
  volumeMode: Filesystem
  resources:
    requests:
      storage: 5Gi
