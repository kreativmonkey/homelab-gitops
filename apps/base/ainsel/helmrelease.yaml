apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ainsel
  namespace: ainsel
spec:
  dependsOn:
    - name: authentik
      namespace: authentik
  interval: 1h
  timeout: 10m
  releaseName: ainsel
  chart:
    spec:
      chart: ./chart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: ainsel
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    namespace: ainsel
    createNamespace: false
    # Cluster baseline owns ingress/egress; avoid overlapping broad chart allows.
    networkPolicy:
      enabled: false
    auth:
      mode: oidc
      oidcIssuer: https://login.f4mily.net/application/o/ainsel/
      oidcClientId: homelab-ainsel
      oidcAudience: homelab-ainsel
      oidcSigningAlgs: RS256
      oidcScopes: openid profile email offline_access
      oidcRolesClaim: groups
    postgres:
      enabled: false
      host: homelab-postgres-rw.cnpg-system.svc.cluster.local
      database: ainsel
      username: ainsel
      auth:
        existingSecret: ainsel-hub-db
    hub:
      extraEnv:
        - name: HUB_INTERNAL_VALIDATE_SECRET
          valueFrom:
            secretKeyRef:
              name: ainsel-runtime
              key: internal-validate-secret
        - name: HUB_SKILLS_MCP_TOKEN
          valueFrom:
            secretKeyRef:
              name: ainsel-runtime
              key: skills-mcp-token
      image:
        repository: ghcr.io/kreativmonkey/ainsel-hub-backend
        tag: "33135fb"
      platformExternalUrl: https://ainsel.cluster.f4mily.net
      ingress:
        enabled: false
      connectorImages:
        webhook:
          repository: ghcr.io/kreativmonkey/ainsel-webhook-receiver
          tag: "bcb69d9"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    ui:
      basePath: ""
      image:
        repository: ghcr.io/kreativmonkey/ainsel-hub-frontend
        tag: "622d1c7"
      ingress:
        enabled: false
      securityContext:
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    mcp:
      enabled: true
      extraEnv:
        - name: INTERNAL_VALIDATE_SECRET
          valueFrom:
            secretKeyRef:
              name: ainsel-runtime
              key: internal-validate-secret
      image:
        repository: ghcr.io/kreativmonkey/ainsel-mcp
        tag: "938fb63"
      externalUrl: https://ainsel.cluster.f4mily.net/mcp
      ingress:
        enabled: false
    agentOperator:
      extraEnv:
        - name: HUB_INTERNAL_VALIDATE_SECRET
          valueFrom:
            secretKeyRef:
              name: ainsel-runtime
              key: internal-validate-secret
      image:
        repository: ghcr.io/kreativmonkey/ainsel-k8s-ai-agent-operator
        tag: "33135fb"
    connectorOperator:
      # Connector routes join the existing F5 NGINX Master on the shared host.
      ingressMode: nginx-inc-minion
      extraEnv:
        - name: HUB_INTERNAL_VALIDATE_SECRET
          valueFrom:
            secretKeyRef:
              name: ainsel-runtime
              key: internal-validate-secret
      # Current source honors POD_NAMESPACE; no cluster-wide workload access.
      clusterWideRbac: false
      image:
        repository: ghcr.io/kreativmonkey/ainsel-k8s-event-source-gateway-operator
        tag: "6f1ca61"
    chatMCP:
      image:
        repository: ghcr.io/kreativmonkey/ainsel-chat-mcp
        tag: "bcb69d9"
