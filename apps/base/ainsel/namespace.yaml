apiVersion: v1
kind: Namespace
metadata:
  name: ainsel
  labels:
    app.kubernetes.io/name: ainsel
    app.kubernetes.io/part-of: homelab-apps
    # Upstream frontend entrypoint writes assets/nginx config as root.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ainsel
  labels:
    app.kubernetes.io/part-of: sa-token-hardening
automountServiceAccountToken: false
