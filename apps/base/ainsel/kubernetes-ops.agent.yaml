apiVersion: ainsel.dev/v1alpha1
kind: Agent
metadata:
  name: a-kubernetes-ops
  namespace: ainsel
spec:
  displayName: Kubernetes Ops
  description: Answers cluster health and troubleshooting questions through read-only Kubernetes MCP tools
  imageRef:
    name: img-kubernetes-ops
  runtime:
    engine: pi
    subscription:
      claimName: kubernetes-ops-home
      # A dedicated subscription must be signed in before the first chat.
      login: true
  llm:
    provider: openai-codex
    model: gpt-6.1-sol
    maxTurns: 20
  persona:
    id: 01m5cpbpavfe023qys66fywkby
  skills:
    items:
      - kubernetes-skill
      - kubernetes-skill-patterns
      - kubernetes-skill-tooling
      - kubernetes-skill-platforms
  enabledTools: []
  scaling:
    replicas: 1
