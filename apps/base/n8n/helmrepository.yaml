# Official community n8n chart (8gears / open-8gears on Artifact Hub).
# OCIRepository + HelmRelease chartRef: HelmRepository type=oci is maintenance
# mode and exposes no status/Ready. Chart version = spec.ref.tag (Renovate flux manager).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: n8n-chart
  namespace: flux-system
spec:
  interval: 24h
  url: oci://8gears.container-registry.com/library/n8n
  ref:
    tag: "2.1.0"
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
