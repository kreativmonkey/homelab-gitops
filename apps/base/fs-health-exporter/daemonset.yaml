# Laeuft auf jedem Node, weil der Zustand pro Node im Kernel haengt: welche
# iSCSI-LUN dort gerade abgeschaltet ist, sieht nur dieser Node.
# hostPath /proc und /sys jeweils read-only — der Exporter liest ausschliesslich.
# Beide Pfade sind unter PSA `baseline` verboten; die Namespace-Labels von
# monitoring stehen auf `privileged` (node-exporter braucht dasselbe).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fs-health-exporter
  namespace: monitoring
  labels:
    app: fs-health-exporter
spec:
  selector:
    matchLabels:
      app: fs-health-exporter
  template:
    metadata:
      labels:
        app: fs-health-exporter
    spec:
      # Ein Node, der wegen Storage-Problemen nicht mehr schedulebar ist, ist
      # genau der Node, dessen Dateisystem-Zustand interessiert.
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: python:3.14-slim
          command: ["python3", "/app/exporter.py"]
          ports:
            - containerPort: 9850
              name: metrics
          env:
            - name: LISTEN_PORT
              value: "9850"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: fs-health-exporter-script
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
