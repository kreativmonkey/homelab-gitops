apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vikunja
  namespace: vikunja
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Vikunja
    gethomepage.dev/description: Aufgaben & Tickets
    gethomepage.dev/group: Office
    gethomepage.dev/icon: vikunja.svg
    gethomepage.dev/pod-selector: app=vikunja
    nginx.org/ssl-redirect: "false"
    nginx.org/redirect-to-https: "true"
    # Task attachments; matches VIKUNJA_FILES_MAXSIZE (50MB) with headroom.
    nginx.org/client-max-body-size: "64m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aufgaben.f4mily.net
      secretName: wildcard-f4mily-net-tls
  rules:
    - host: aufgaben.f4mily.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vikunja
                port:
                  number: 3456
