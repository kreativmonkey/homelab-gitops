apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server-sa
  namespace: mcp-system
  labels:
    app.kubernetes.io/name: mcp-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-agent-reader
  labels:
    app.kubernetes.io/name: mcp-server
rules:
  # "delete" (hinzugefügt in 230ab2f8, 2026-06-11, "restart capability") hatte
  # nie einen Konsumenten: der Server läuft seit dem allerersten Commit
  # (57a5545c, 2026-06-07) mit --read-only, und seine tools/list-Antwort
  # enthält ausschließlich lesende Tools, keinerlei delete/write-Tool.
  # Cluster-weites delete auf persistentvolumeclaims war dabei der schärfste
  # Teil: beide relevanten StorageClasses nutzen reclaimPolicy: Delete, d. h.
  # ein gelöschtes PVC hätte das dahinterliegende Volume zerstört. Entfernt
  # 2026-09-24.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps", "persistentvolumeclaims", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # "nodes/proxy" erlaubt Lesezugriff auf die Kubelet-API vorbei am
  # per-Object-RBAC und Audit-Log des API-Servers (u. a. /logs/). Es hing nur
  # an den beiden MCP-Tools nodes_stats_summary und nodes_log — nodes_top und
  # pods_top laufen weiterhin über metrics.k8s.io (als dieser ServiceAccount
  # verifiziert). Diese zwei Tools bewusst aufgegeben am 2026-09-24;
  # Node-Metriken bleiben über VictoriaMetrics verfügbar.
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "nodes/stats"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "helmrepositories", "helmcharts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-agent-reader
  labels:
    app.kubernetes.io/name: mcp-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-agent-reader
subjects:
  - kind: ServiceAccount
    name: mcp-server-sa
    namespace: mcp-system
