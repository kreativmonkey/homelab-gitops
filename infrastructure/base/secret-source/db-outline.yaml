apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-outline
  namespace: secret-source
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Orphan
    immutable: true
    template:
      metadata:
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-32
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-db-outline
  namespace: secret-source
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames: [db-outline]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-db-outline
  namespace: secret-source
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-db-outline
subjects:
  - kind: ServiceAccount
    name: eso-store-reader
    namespace: outline
  - kind: ServiceAccount
    name: eso-store-reader
    namespace: cnpg-system
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-db-credentials-eso
  namespace: cnpg-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: homelab
  target:
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: outline
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: db-outline
        property: password
