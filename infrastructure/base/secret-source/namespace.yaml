apiVersion: v1
kind: Namespace
metadata:
  name: secret-source
  labels:
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    # Namespace pruning would also delete Secrets with their own prune protection.
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: secret-source
automountServiceAccountToken: false
