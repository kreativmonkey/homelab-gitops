apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-valkey-key
  namespace: secret-source
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: CreatedOnce
  target:
    creationPolicy: Orphan
    immutable: true
    template:
      metadata:
        labels:
          app.kubernetes.io/name: outline-valkey
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-32
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-outline-valkey-key
  namespace: secret-source
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames: [outline-valkey-key]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-outline-valkey-key
  namespace: secret-source
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-outline-valkey-key
subjects:
  - kind: ServiceAccount
    name: eso-store-reader
    namespace: outline
