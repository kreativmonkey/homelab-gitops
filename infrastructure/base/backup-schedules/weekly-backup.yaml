apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly-backup
  namespace: velero
spec:
  schedule: "0 3 * * 0"
  template:
    includedNamespaces:
      - '*'
    excludedResources:
      - events
      - events.events.k8s.io
    storageLocation: default
    ttl: 672h
    includeClusterResources: true
    snapshotVolumes: false
    # Opt-in wie im daily-backup, hier umso wichtiger: includedNamespaces ist
    # '*', ein Opt-out-Lauf wuerde jede Mediathek im Cluster nach Garage
    # schreiben. Begruendung siehe daily-backup.yaml.
    defaultVolumesToFsBackup: false
