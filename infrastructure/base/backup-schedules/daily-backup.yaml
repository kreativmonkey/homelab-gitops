apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-backup
  namespace: velero
spec:
  schedule: "0 2 * * *"
  template:
    # Jeder hier gelistete, im Cluster nicht existierende Namespace erzeugt
    # einen Backup-Error und stempelt den Lauf dauerhaft auf PartiallyFailed.
    # Damit wird VeleroBackupFailures zum Dauer-Alert und echte Fehler gehen
    # darin unter -- die Liste muss beim Entfernen einer App mitgepflegt werden.
    includedNamespaces:
      - default
      - monitoring
      - external-dns
      - ingress-nginx
      - cnpg-system
      - goloom
      - sparkyfitness
      - authentik
      - forgejo
      - nextcloud
      - paperless-ngx
      - tandoor
      - immich
      - jellyfin
      - kavita
      - sterling-pdf
      - searxng
      - teslamate
      - watchyourlan
    excludedResources:
      - events
      - events.events.k8s.io
    storageLocation: default
    ttl: 168h
    includeClusterResources: true
    snapshotVolumes: false
    defaultVolumesToFsBackup: true
