apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-backup
  namespace: velero
spec:
  schedule: "0 2 * * *"
  template:
    # Alle Namespaces, wie im weekly-backup. Eine gepflegte Liste veraltet
    # still, und jeder darin verbliebene, entfernte Namespace laesst den Lauf
    # dauerhaft auf PartiallyFailed stehen.
    includedNamespaces:
      - '*'
    excludedResources:
      - events
      - events.events.k8s.io
    storageLocation: default
    ttl: 168h
    includeClusterResources: true
    snapshotVolumes: false
    # Opt-in: Volumes kommen per `backup.velero.io/backup-volumes` am Pod dazu.
    # Ohne das landen auch die Mediatheken im Garage-Bucket, der auf demselben
    # Storagepool liegt wie die Quelldaten.
    defaultVolumesToFsBackup: false
