apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  timeout: 15m
  targetNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack-repo
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    crds:
      enabled: true
    prometheus:
      enabled: true
    installCRDs: true
    global:
      priorityClassName: "homelab-infrastructure"
    serviceAccount:
      name: cert-manager
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # p95/p99-derived (14d/7d VictoriaMetrics history), previously unset (Burstable
    # first-to-be-OOM-killed). No CPU limit — cluster convention is requests-only for CPU.
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 80Mi
        limits:
          memory: 128Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-hetzner
  namespace: cert-manager
spec:
  interval: 1h
  timeout: 15m
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: cert-manager-webhook-hetzner
      version: "0.8.1"
      sourceRef:
        kind: HelmRepository
        name: hetzner-webhook-repo
        namespace: flux-system
  dependsOn:
    - name: cert-manager
  values:
    # p95/p99-derived (14d/7d VictoriaMetrics history), previously unset.
    resources:
      requests:
        cpu: 10m
        memory: 80Mi
      limits:
        memory: 128Mi
