apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-cluster
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # All pods — vmagent endpoint scraping. ipBlock never matches pod IPs
    # under Cilium, so select them by namespace instead.
    - to:
        - namespaceSelector: {}
    # Node CIDR — kubelet (10250) and node-exporter (9100), control-plane
    # component metrics.
    - to:
        - ipBlock:
            cidr: 192.168.10.0/24
