apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-truenas
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # truenas-exporter scrapes the TrueNAS API on :8080 (the appliance's
    # web UI/API moved there; NPM now sits on 80/443). allow-egress-external
    # only opens 80/443, so this dedicated rule is needed.
    - to:
        - ipBlock:
            cidr: 192.168.10.94/32
      ports:
        - protocol: TCP
          port: 8080
