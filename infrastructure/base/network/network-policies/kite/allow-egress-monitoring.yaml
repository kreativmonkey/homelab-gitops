apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-monitoring
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # kite queries the VictoriaMetrics prometheus API for its dashboards.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8481
