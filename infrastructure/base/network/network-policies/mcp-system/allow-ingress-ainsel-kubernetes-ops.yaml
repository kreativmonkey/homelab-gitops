apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-ainsel-kubernetes-ops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ainsel
          podSelector:
            matchLabels:
              ainsel.dev/agent: a-kubernetes-ops
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ainsel
          podSelector:
            matchLabels:
              app.kubernetes.io/component: hub-backend
      ports:
        - protocol: TCP
          port: 8080
