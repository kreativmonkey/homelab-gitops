apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# mcp-system = kubernetes-mcp-server. Reads cluster state via the k8s API
# (egress-apiserver) and calls external LLM/tool APIs (egress-external).
namespace: mcp-system
components:
  - ../baseline
  - ../egress-apiserver
  - ../egress-external
