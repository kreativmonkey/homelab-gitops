apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-probes
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Probe targets are external sites and *.f4mily.net (ingress LB) on 80/443.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
