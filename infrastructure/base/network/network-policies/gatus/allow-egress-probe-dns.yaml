apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-probe-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Gatus config forces DNS via the LAN router and Cloudflare, not CoreDNS.
    - to:
        - ipBlock:
            cidr: 192.168.10.1/32
        - ipBlock:
            cidr: 1.1.1.1/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
