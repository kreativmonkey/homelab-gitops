apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# gatus = uptime prober. Uses custom DNS resolvers (192.168.10.1, 1.1.1.1)
# and probes external + internal HTTPS. Baseline (ingress/scrape/DNS-CoreDNS)
# plus bespoke DNS egress and broad probe egress (443/80 to any host).
namespace: gatus
components:
  - ../baseline
resources:
  - allow-egress-probe-dns.yaml
  - allow-egress-probes.yaml
