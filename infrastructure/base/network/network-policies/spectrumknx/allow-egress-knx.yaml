apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-knx
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # KNX IP Secure tunneling to the gateway at 192.168.10.20 (TCP + UDP).
    - to:
        - ipBlock:
            cidr: 192.168.10.20/32
      ports:
        - protocol: TCP
          port: 3671
        - protocol: UDP
          port: 3671
