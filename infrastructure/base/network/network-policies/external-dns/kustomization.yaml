apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# external-dns = DNS sync. Watches Ingress/Service via the k8s API
# (egress-apiserver) and pushes records to the Hetzner DNS API (external).
namespace: external-dns
components:
  - ../baseline
  - ../egress-external
  - ../egress-apiserver
