apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-kubernetes-mcp-discovery
spec:
  # The hub discovers tools for the frontend's MCP catalogue.
  podSelector:
    matchLabels:
      app.kubernetes.io/component: hub-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-server
      ports:
        - protocol: TCP
          port: 8080
