apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-exapps
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # ExApps call back into AppAPI harp (counterpart of
    # nextcloud-exapps/allow-egress-harp.yaml).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nextcloud-exapps
      ports:
        - protocol: TCP
          port: 8780
        - protocol: TCP
          port: 8782
