apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# nextcloud = CNPG (postgres) + redis (in-ns) + Garage S3 (LAN) + mail + OIDC.
# S3 egress to the Garage endpoint is bespoke (LAN IP, not 80/443).
# Public PHP app: egress-internet instead of egress-external (no LAN on 80/443).
namespace: nextcloud
components:
  - ../egress-apiserver
  - ../baseline
  - ../egress-internet
  - ../egress-database
  - ../egress-mail
resources:
  - allow-egress-exapps.yaml
  - allow-ingress-exapps.yaml
  - allow-egress-s3.yaml
