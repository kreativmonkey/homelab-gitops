apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-s3-garage
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Garage S3 (primary object store) on the TrueNAS/LAN host.
    - to:
        - ipBlock:
            cidr: 192.168.10.94/32
      ports:
        - protocol: TCP
          port: 30188
        - protocol: TCP
          port: 30190
