apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Enforced by Cilium (ADR 0004). Onboard a namespace with Cilium's policy audit
# mode and Hubble — see docs/runbooks/network-policies-rollout.md.
# Wired as its own Flux Kustomization (infra-network-policies).
resources:
  - cluster   # CiliumClusterwideNetworkPolicy: host/remote-node ingress
  - homer
  - linkding
  - readeck
  # App namespaces.
  - authentik
  - forgejo
  - immich
  - nextcloud
  - gatus
  - ai-agents
  - audiobookshelf
  - dawarich
  - goloom
  - hister
  - jellyfin
  - kavita
  - outline
  - paperless-ngx
  - searxng
  - sparkyfitness
  - sterling-pdf
  - tandoor
  - vikunja
  - teslamate
  - workshops
  - homepage
  - kite
  - renovate
  - spectrumknx
  - nextcloud-exapps
  - ai-ops
  # Infra/operator namespaces.
  - cnpg-system
  - monitoring
  - cert-manager
  - democratic-csi
  - local-path-storage
  - velero
  - backup-offsite
  - reflector-system
  - external-dns
  - mcp-system
# hostNetwork NS (ingress-nginx, netbird, watchyourlan) stay out: policies
# never apply to hostNetwork pods.
