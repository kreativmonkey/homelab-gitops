apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# velero = backup server + node-agent DaemonSet. Both watch the API server
# (egress-apiserver) and read/write backups to Garage S3 on the TrueNAS host
# (192.168.10.94:30188). A wrong deny causes silent backup failure. Kopia
# maintain jobs also run here and use the same S3 endpoint.
namespace: velero
components:
  - ../baseline
  - ../egress-apiserver
resources:
  - allow-egress-s3.yaml
