apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# velero = backup server + node-agent DaemonSet. Both watch the API server
# (egress-apiserver) and read/write backups to Garage S3 through
# s3.nas.f4mily.net:443. Keep 30188 permitted until its consumers migrate.
# A wrong deny causes silent backup failure.
namespace: velero
components:
  - ../baseline
  - ../egress-apiserver
resources:
  - allow-egress-s3.yaml
