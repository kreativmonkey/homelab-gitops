apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# teslamate = Tesla stats. Ingress (app + grafana); CNPG postgres
# (homelab-postgres-teslamate in cnpg-system); Tesla fleet/owner API + grafana
# OIDC over HTTPS. Baseline + database + external egress.
namespace: teslamate
components:
  - ../baseline
  - ../egress-database
  - ../egress-external
