apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-renovate
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Renovate talks to forgejo-app:3000 directly (counterpart of
    # renovate/allow-egress-forgejo.yaml).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: renovate
      ports:
        - protocol: TCP
          port: 3000
