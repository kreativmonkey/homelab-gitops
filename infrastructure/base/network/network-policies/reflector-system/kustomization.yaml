apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# reflector-system = secret/ConfigMap reflector. Watches resources across all
# namespaces via the API server and replicates the cert-manager wildcard cert
# cluster-wide (egress-apiserver only). A wrong deny breaks Ingress-TLS
# distribution.
namespace: reflector-system
components:
  - ../baseline
  - ../egress-apiserver
