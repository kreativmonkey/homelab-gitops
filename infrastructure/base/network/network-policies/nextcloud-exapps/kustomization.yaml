apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# nextcloud-exapps = Nextcloud ExApp runtime. ExApp pods reach the AppAPI harp
# proxy in the nextcloud NS (:8780/:8782); external calls via egress-external.
namespace: nextcloud-exapps
components:
  - ../baseline
  - ../egress-external
resources:
  - allow-egress-harp.yaml
