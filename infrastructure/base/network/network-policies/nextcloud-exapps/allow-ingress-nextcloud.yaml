apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nextcloud
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Harp (nextcloud NS) reaches the ExApp pods on per-app ports.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nextcloud
