apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# paperless-ngx = document manager. Ingress; document services (gotenberg,
# tika, redis, paperless-gpt) run same-namespace; CNPG postgres
# (homelab-postgres-paperless in cnpg-system); optional external fetch.
# Baseline + database + external egress.
namespace: paperless-ngx
components:
  - ../baseline
  - ../egress-database
  - ../egress-external
