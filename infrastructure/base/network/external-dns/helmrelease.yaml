apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  timeout: 15m
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  targetNamespace: external-dns
  chart:
    spec:
      chart: external-dns
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: external-dns-repo
        namespace: flux-system
  values:
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/mconfalonieri/external-dns-hetzner-webhook
          tag: v1.0.2
        env:
        - name: HETZNER_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-token
              name: hetzner-api-token
          # v1.0.0 is Cloud-API-only: the legacy dns.hetzner.com provider is gone.
          # USE_CLOUD_API must be set explicitly, otherwise the webhook defaults to
          # the legacy DNS API and rejects the Cloud token as "unauthorized" ->
          # external-dns crashloops on every startup sync. The secret holds a
          # Hetzner Cloud API token, which is what the Cloud DNS API expects.
        - name: USE_CLOUD_API
          value: "true"
        livenessProbe:
          httpGet:
            path: /health
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        service:
          port: 8888
        # p95/p99-derived (14d/7d VictoriaMetrics history), previously unset
        # (Burstable, first-to-be-OOM-killed). No CPU limit by convention.
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
    extraArgs:
      - --webhook-provider-url=http://localhost:8888
    domainFilters:
      - cluster.f4mily.net
    policy: sync
    registry: txt
    txtOwnerId: homelab-k8s
    txtPrefix: externaldns-
    sources:
      - ingress
      - service
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 30m
        memory: 128Mi
