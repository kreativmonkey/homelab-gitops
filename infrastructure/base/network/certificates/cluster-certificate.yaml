apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-cluster-f4mily-net
  namespace: cert-manager
  annotations:
    kustomize.toolkit.fluxcd.io/depends-on: helm.toolkit.fluxcd.io/HelmRelease/cert-manager/cert-manager
spec:
  secretName: wildcard-cluster-f4mily-net-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "*.cluster.f4mily.net"
    - "cluster.f4mily.net"
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      # Include public and private ingress consumers. The namespace name label is immutable.
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces-selector: >-
        kubernetes.io/metadata.name in (ai-ops,ainsel,authentik,cnpg-system,gatus,homer,kite,mcp-system,monitoring,navidrome,paperless-ngx,spectrumknx,watchyourlan)
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: ""
