apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-f4mily-net
  namespace: cert-manager
  annotations:
    kustomize.toolkit.fluxcd.io/depends-on: helm.toolkit.fluxcd.io/HelmRelease/cert-manager/cert-manager
spec:
  secretName: wildcard-f4mily-net-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "*.f4mily.net"
    - "f4mily.net"
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      # Grant mirrors to namespaces serving the public wildcard, including private overlays.
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces-selector: >-
        kubernetes.io/metadata.name in
        (audiobookshelf,authentik,dawarich,forgejo,goloom,hister,homelable,homepage,homer,immich,jellyfin,kavita,linkding,nextcloud,outline,paperless-ngx,readeck,searxng,sparkyfitness,sterling-pdf,tandoor,teslamate,vikunja,workshops)
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: ""
