# RBAC for remediation-api (issue #744).
# Previously a ClusterRole with pods delete + deployments/statefulsets/daemonsets
# patch cluster-wide. Now scoped to the exact namespaces the API is allowed to
# touch (ALLOWED_NAMESPACES in configmap.yaml) and the exact verbs its code uses
# (delete-pod, rollout-restart, get-pods, investigate, fix-resources).
# One Role + RoleBinding per allowed namespace; the SA keeps its mounted token
# because the service genuinely calls the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-api
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: remediation-api
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-api
  namespace: monitoring
  labels:
    app.kubernetes.io/name: remediation-api
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-api
  namespace: monitoring
  labels:
    app.kubernetes.io/name: remediation-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: remediation-api
subjects:
  - kind: ServiceAccount
    name: remediation-api
    namespace: ai-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-api
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: remediation-api
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-api
  namespace: ai-ops
  labels:
    app.kubernetes.io/name: remediation-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: remediation-api
subjects:
  - kind: ServiceAccount
    name: remediation-api
    namespace: ai-ops
