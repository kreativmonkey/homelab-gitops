apiVersion: v1
kind: ServiceAccount
metadata:
  name: offsite-backup
  namespace: backup-offsite
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: offsite-backup-nextcloud
  namespace: nextcloud
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["nextcloud"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["nextcloud-s3-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: offsite-backup-nextcloud
  namespace: nextcloud
subjects:
  - kind: ServiceAccount
    name: offsite-backup
    namespace: backup-offsite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: offsite-backup-nextcloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: offsite-backup-cnpg
  namespace: cnpg-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: offsite-backup-cnpg
  namespace: cnpg-system
subjects:
  - kind: ServiceAccount
    name: offsite-backup
    namespace: backup-offsite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: offsite-backup-cnpg
---
# Backup liest RWO-App-State ausschliesslich via kubectl exec aus dem jeweiligen
# Pod. Die Rechte bleiben auf Pods und deren Namespace beschraenkt.
