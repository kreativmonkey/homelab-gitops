apiVersion: v1
kind: ConfigMap
metadata:
  name: offsite-backup-scripts
  namespace: backup-offsite
data:
  prepare-rclone.sh: |
    #!/bin/sh
    set -eu
    umask 077

    # Hetzner Storage Box ED25519 fingerprint:
    # SHA256:XqONwb1S0zuj5A1CDxpOSuD2hnAArV1A3wKY7Z3sdgM
    printf '[%s]:23 ssh-ed25519 %s\n' "${STORAGEBOX_HOST}" \
      'AAAAC3NzaC1lZDI1NTE5AAAAIICf9svRenC/PLKIL9nk6K/pxQgoiFC41wTNvoIncOxs' \
      > /config/storagebox-known-hosts
    storagebox_password="$(rclone obscure "${STORAGEBOX_PASSWORD}")"
    rclone config create storagebox sftp \
      host "${STORAGEBOX_HOST}" \
      user "${STORAGEBOX_USERNAME}" \
      port 23 \
      pass "${storagebox_password}" \
      shell_type unix \
      known_hosts_file /config/storagebox-known-hosts \
      host_key_algorithms ssh-ed25519 \
      --config /config/rclone.conf >/dev/null

    if [ -s /config/garage-access-key.b64 ]; then
      garage_access_key="$(base64 -d </config/garage-access-key.b64)"
      garage_secret_key="$(base64 -d </config/garage-secret-key.b64)"
      rclone config create garage s3 \
        provider Other \
        env_auth false \
        access_key_id "${garage_access_key}" \
        secret_access_key "${garage_secret_key}" \
        endpoint http://192.168.10.94:30188 \
        region garage \
        force_path_style true \
        --config /config/rclone.conf >/dev/null
    fi

  stage-objects.sh: |
    #!/bin/sh
    set -u
    # Spiegelt den Nextcloud-Primary-Storage (Garage) ins Staging.
    # Laeuft zweimal pro Backup: einmal ohne Wartungsmodus als Prefetch, danach
    # ein zweites Mal im Wartungsmodus. Der zweite Lauf ist inkrementell und
    # damit kurz -- so bleibt das Wartungsfenster klein, ohne Konsistenz
    # zwischen Objekten und Datenbank-Dump aufzugeben.
    exec rclone sync garage:nextcloud /staging/objects \
      --config=/config/rclone.conf --fast-list \
      --transfers=4 --checkers=8 --delete-during

  restic-backup.sh: |
    #!/bin/sh
    set -u

    tag="$1"
    shift
    result=0

    for delay in 1 2 4 8 16; do
      restic snapshots >/dev/null 2>&1 && break
      sleep "${delay}"
    done
    if ! restic snapshots >/dev/null 2>&1; then
      restic init || result=1
    fi
    if [ "${result}" -eq 0 ]; then
      restic backup --host homelab --tag "${tag}" "$@" || result=1
    fi
    if [ "${result}" -eq 0 ]; then
      restic forget --host homelab --tag "${tag}" \
        --keep-daily 14 --keep-weekly 8 --keep-monthly 12 --keep-yearly 3 \
        || result=1
    fi

    if [ "${result}" -eq 0 ]; then
      touch "/work/${tag}.ok"
    else
      touch "/work/${tag}.failed"
    fi
    if [ "${EXIT_ON_FAILURE:-false}" = "true" ]; then
      exit "${result}"
    fi
    exit 0

  record-sample.sh: |
    #!/bin/sh
    set -eu

    tag="$1"
    shift
    sample_path="$(find "$@" -type f -print -quit)"
    test -n "${sample_path}"
    mkdir -p /staging/verify
    printf '%s\n' "${sample_path}" > "/staging/verify/${tag}-sample.path"
    sha256sum "${sample_path}" | cut -d ' ' -f 1 \
      > "/staging/verify/${tag}-sample.sha256"

  nextcloud-maintenance.sh: |
    #!/bin/sh
    set -u
    # Haelt Nextcloud NUR fuer den konsistenzkritischen Teil des Backups
    # (Objekt-Nachsync + DB-Dump + App-State) im Wartungsmodus. Freigabe
    # erfolgt, sobald /work/capture-complete existiert -- nicht erst nach dem
    # restic-Upload.
    #
    # Jede Zustandsaenderung wird gegen `occ config:system:get maintenance`
    # verifiziert. Ein nicht bestaetigter Zustand ist ein Fehler und wird als
    # Marker hinterlegt, damit finalize den Job scheitern laesst -- frueher
    # verschluckte `|| true` genau diesen Fall und Nextcloud blieb still im
    # Wartungsmodus haengen.

    # 60s ist reichlich (occ antwortet normal in Sekunden) und haelt den
    # Worst Case aus 5 Versuchen unter dem Budget von wait-maintenance.
    occ() {
      timeout 60 kubectl exec -n nextcloud deploy/nextcloud -c nextcloud -- \
        php occ "$@"
    }

    current_mode() {
      mode="$(occ config:system:get maintenance 2>/dev/null \
        | tail -n 1 | tr -d '[:space:]')"
      # Fehlt der Key ganz, ist der Wartungsmodus aus.
      [ -n "${mode}" ] || mode=false
      printf '%s' "${mode}"
    }

    # $1 = on|off, $2 = erwarteter Zustand (true|false)
    set_mode() {
      attempt=1
      while [ "${attempt}" -le 5 ]; do
        occ maintenance:mode "--$1" >/dev/null 2>&1
        if [ "$(current_mode)" = "$2" ]; then
          return 0
        fi
        echo "maintenance:mode --$1 nicht bestaetigt (Versuch ${attempt}/5)"
        attempt=$((attempt + 1))
        sleep 10
      done
      return 1
    }

    # Idempotent: laeuft aus dem Normalfluss UND aus dem TERM-Handler.
    release() {
      [ -f /work/maintenance-off ] && return 0
      if set_mode off false; then
        rm -f /work/maintenance-off.failed
        touch /work/maintenance-off
        echo "Wartungsmodus freigegeben und verifiziert"
        return 0
      fi
      touch /work/maintenance-off.failed
      echo "FEHLER: Wartungsmodus konnte nicht freigegeben werden"
      return 1
    }

    trap 'release; exit 0' TERM INT

    # Sidecar-Neustart nach dem kritischen Teil darf den Wartungsmodus nicht
    # erneut setzen -- dann nur noch freigeben.
    if [ -f /work/capture-complete ]; then
      echo "Neustart nach Capture-Phase, setze Wartungsmodus nicht erneut"
      until release; do sleep 60; done
      while true; do sleep 3600; done
    fi

    if set_mode on true; then
      touch /work/maintenance-ready
      echo "Wartungsmodus aktiv und verifiziert"
    else
      echo "FEHLER: Wartungsmodus konnte nicht aktiviert werden"
      touch /work/maintenance-failed
      # Halb gesetzter Zustand ist moeglich -- in jedem Fall wieder freigeben.
      release || true
      while true; do sleep 3600; done
    fi

    while [ ! -f /work/capture-complete ]; do
      sleep 5
    done

    # Read-only Dateisystem im Nextcloud-Pod (iSCSI-Remount) laesst occ
    # scheitern. Weiter versuchen, solange der Pod lebt -- der Marker bleibt
    # bis zum bestaetigten Erfolg liegen.
    until release; do
      sleep 60
    done
    while true; do sleep 3600; done

  nextcloud-capture.sh: |
    #!/bin/sh
    set -u
    result=0
    mkdir -p /staging/database

    primary="$(kubectl get pods -n cnpg-system \
      -l cnpg.io/cluster=homelab-postgres,role=primary \
      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)"
    if [ -z "${primary}" ]; then
      echo "FEHLER: kein primaerer homelab-postgres-Pod gefunden"
      result=1
    elif ! kubectl exec -n cnpg-system "${primary}" -- \
      pg_dump -d nextcloud -Fc > /staging/database/nextcloud.dump; then
      echo "FEHLER: pg_dump der Nextcloud-Datenbank fehlgeschlagen"
      result=1
    fi

    if ! kubectl exec -n nextcloud deploy/nextcloud -c nextcloud -- \
      tar -C /var/www/html -czf - . > /staging/nextcloud-app.tar.gz; then
      echo "FEHLER: App-State-Tar aus /var/www/html fehlgeschlagen"
      result=1
    fi

    if [ "${result}" -eq 0 ]; then
      touch /work/nextcloud-capture.ok
    else
      touch /work/nextcloud-capture.failed
    fi
    exit 0

  finalize.sh: |
    #!/bin/sh
    set -u
    # Endabnahme des Nextcloud-Offsite-Jobs. Benennt fehlende Erfolgs-Marker
    # explizit, damit ein Fehlschlag im Job-Log lesbar ist statt als nackter
    # exit 1 aus einer test-Kette.
    result=0

    # Der Wartungsmodus wird direkt nach der Capture-Phase freigegeben, also
    # lange vor diesem Schritt. Falls die Freigabe noch laeuft (Retry bei
    # read-only Dateisystem), kurz Zeit geben.
    attempt=0
    while [ ! -f /work/maintenance-off ] && [ "${attempt}" -lt 30 ]; do
      sleep 10
      attempt=$((attempt + 1))
    done

    for flag in maintenance-off nextcloud-stage.ok nextcloud-capture.ok \
      nextcloud.ok; do
      if [ ! -f "/work/${flag}" ]; then
        echo "FEHLT: /work/${flag}"
        result=1
      fi
    done

    for marker in /work/*.failed; do
      [ -e "${marker}" ] || continue
      echo "FEHLERMARKER: ${marker}"
      result=1
    done

    if [ "${result}" -ne 0 ]; then
      echo "Zustand in /work:"
      ls -1 /work
      echo "Wartungsmodus pruefen: kubectl exec -n nextcloud deploy/nextcloud" \
        "-c nextcloud -- php occ maintenance:mode"
    else
      echo "Nextcloud-Offsite-Backup vollstaendig"
    fi
    exit "${result}"

  verify.sh: |
    #!/bin/sh
    set -u
    result=0

    fail() {
      echo "FEHLER: $1"
      result=1
    }

    for delay in 1 2 4 8 16; do
      restic snapshots >/dev/null 2>&1 && break
      sleep "${delay}"
    done
    restic check --read-data-subset=5% || fail "restic check"
    restic restore latest --host homelab --tag immich \
      --include '/staging/database/immich.dump' \
      --include '/staging/verify/immich-sample.path' \
      --include '/staging/verify/immich-sample.sha256' \
      --target /restore/immich \
      || fail "Restore immich-Dump/Manifest"
    restic restore latest --host homelab --tag nextcloud \
      --include '/staging/database/nextcloud.dump' \
      --include '/staging/nextcloud-app.tar.gz' \
      --include '/staging/verify/nextcloud-sample.path' \
      --include '/staging/verify/nextcloud-sample.sha256' \
      --target /restore/nextcloud \
      || fail "Restore nextcloud-Dump/App-State"
    for tag in immich nextcloud; do
      manifest_root="/restore/${tag}/staging/verify"
      sample_path="$(cat "${manifest_root}/${tag}-sample.path" 2>/dev/null)" \
        || fail "Sample-Pfad ${tag} nicht lesbar"
      expected="$(cat "${manifest_root}/${tag}-sample.sha256" 2>/dev/null)" \
        || fail "Sample-Hash ${tag} nicht lesbar"
      if [ -n "${sample_path:-}" ] && [ -n "${expected:-}" ]; then
        restic restore latest --host homelab --tag "${tag}" \
          --include "${sample_path}" --target "/restore/${tag}-sample" \
          || fail "Restore Sample-Datei ${tag}"
        restored_path="/restore/${tag}-sample${sample_path}"
        actual="$(sha256sum "${restored_path}" 2>/dev/null | cut -d ' ' -f 1)" \
          || fail "Hash der restaurierten ${tag}-Sample-Datei"
        [ "${actual:-}" = "${expected}" ] \
          || fail "Hash-Vergleich ${tag}: erwartet ${expected}, gelesen ${actual:-leer}"
      else
        fail "Sample-Manifest ${tag} unvollstaendig"
      fi
    done
    if [ "${result}" -eq 0 ]; then
      restic prune || fail "restic prune"
    fi

    if [ "${result}" -eq 0 ]; then
      touch /work/restore.ok
      echo "Restore-Verifikation vollstaendig"
    else
      touch /work/restore.failed
    fi
    exit 0
