apiVersion: v1
kind: ConfigMap
metadata:
  name: offsite-backup-scripts
  namespace: backup-offsite
data:
  prepare-rclone.sh: |
    #!/bin/sh
    set -eu
    umask 077

    # Hetzner Storage Box ED25519 fingerprint:
    # SHA256:XqONwb1S0zuj5A1CDxpOSuD2hnAArV1A3wKY7Z3sdgM
    printf '[%s]:23 ssh-ed25519 %s\n' "${STORAGEBOX_HOST}" \
      'AAAAC3NzaC1lZDI1NTE5AAAAIICf9svRenC/PLKIL9nk6K/pxQgoiFC41wTNvoIncOxs' \
      > /config/storagebox-known-hosts
    storagebox_password="$(rclone obscure "${STORAGEBOX_PASSWORD}")"
    rclone config create storagebox sftp \
      host "${STORAGEBOX_HOST}" \
      user "${STORAGEBOX_USERNAME}" \
      port 23 \
      pass "${storagebox_password}" \
      shell_type unix \
      known_hosts_file /config/storagebox-known-hosts \
      host_key_algorithms ssh-ed25519 \
      --config /config/rclone.conf >/dev/null

    if [ -s /config/garage-access-key.b64 ]; then
      garage_access_key="$(base64 -d </config/garage-access-key.b64)"
      garage_secret_key="$(base64 -d </config/garage-secret-key.b64)"
      rclone config create garage s3 \
        provider Other \
        env_auth false \
        access_key_id "${garage_access_key}" \
        secret_access_key "${garage_secret_key}" \
        endpoint http://192.168.10.94:30188 \
        region garage \
        force_path_style true \
        --config /config/rclone.conf >/dev/null
    fi

  stage-objects.sh: |
    #!/bin/sh
    set -u
    # Spiegelt den Nextcloud-Primary-Storage ins Staging. Laeuft zweimal pro
    # Backup: als Prefetch ohne Wartungsmodus, danach inkrementell im
    # Wartungsmodus -- kleines Fenster, ohne Konsistenz zum Dump aufzugeben.
    exec rclone sync garage:nextcloud /staging/objects \
      --config=/config/rclone.conf --fast-list \
      --transfers=4 --checkers=8 --delete-during

  restic-backup.sh: |
    #!/bin/sh
    set -u

    tag="$1"
    shift
    result=0

    for delay in 1 2 4 8 16; do
      restic snapshots >/dev/null 2>&1 && break
      sleep "${delay}"
    done
    if ! restic snapshots >/dev/null 2>&1; then
      restic init || result=1
    fi
    if [ "${result}" -eq 0 ]; then
      restic backup --host homelab --tag "${tag}" "$@" || result=1
    fi
    if [ "${result}" -eq 0 ]; then
      restic forget --host homelab --tag "${tag}" \
        --keep-daily 14 --keep-weekly 8 --keep-monthly 12 --keep-yearly 3 \
        || result=1
    fi

    if [ "${result}" -eq 0 ]; then
      touch "/work/${tag}.ok"
    else
      touch "/work/${tag}.failed"
    fi
    if [ "${EXIT_ON_FAILURE:-false}" = "true" ]; then
      exit "${result}"
    fi
    exit 0

  record-sample.sh: |
    #!/bin/sh
    set -eu

    tag="$1"
    shift
    sample_path="$(find "$@" -type f -print -quit)"
    test -n "${sample_path}"
    mkdir -p /staging/verify
    printf '%s\n' "${sample_path}" > "/staging/verify/${tag}-sample.path"
    sha256sum "${sample_path}" | cut -d ' ' -f 1 \
      > "/staging/verify/${tag}-sample.sha256"

  databases-dump.sh: |
    #!/bin/sh
    set -u
    # Dumpt jede Datenbank jedes CNPG-Clusters. Cluster und Datenbanken werden
    # entdeckt, nicht gepflegt -- eine Liste im Manifest wuerde veralten und
    # neue Apps stillschweigend ungesichert lassen.
    # Barman sichert dieselben Daten lokal fuer schnelle Restores; dieser Job
    # ist die Offsite-Kopie fuer den Fall, dass das NAS weg ist.
    result=0
    mkdir -p /staging/database

    primaries="$(kubectl get pods -n cnpg-system -l role=primary \
      -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.labels.cnpg\.io/cluster}{"\n"}{end}')"
    if [ -z "${primaries}" ]; then
      echo "FEHLER: kein primaerer CNPG-Pod gefunden"
      exit 1
    fi

    echo "${primaries}" | while read -r pod cluster; do
      [ -n "${pod}" ] || continue
      dbs="$(kubectl exec -n cnpg-system "${pod}" -c postgres -- psql -Atc \
        "select datname from pg_database where not datistemplate \
         and datname not in ('postgres','template0','template1')" 2>/dev/null)"
      if [ -z "${dbs}" ]; then
        echo "FEHLER: keine Datenbanken in ${cluster} gefunden"
        echo fail > /staging/database/.failed
        continue
      fi
      for db in ${dbs}; do
        target="/staging/database/${cluster}-${db}.dump"
        if kubectl exec -n cnpg-system "${pod}" -c postgres -- \
          pg_dump -d "${db}" -Fc > "${target}"; then
          echo "gesichert: ${cluster}/${db}"
        else
          echo "FEHLER: pg_dump ${cluster}/${db}"
          echo fail > /staging/database/.failed
        fi
      done
    done

    # Die while-Schleife laeuft in einer Subshell, result waere dort verloren.
    if [ -f /staging/database/.failed ]; then
      rm -f /staging/database/.failed
      result=1
    fi
    exit "${result}"

  storagebox-quota.sh: |
    #!/bin/sh
    set -u
    # Die Storage Box teilt ihr Kontingent mit anderen Sicherungen. Laeuft sie
    # voll, scheitern nicht nur die Cluster-Backups, sondern Borg kann nicht
    # einmal mehr seine Lock-Datei anlegen -- Platz muss dann von aussen
    # geschaffen werden. Deshalb rechtzeitig scheitern statt erst im Ernstfall.
    min_free="${MIN_FREE_BYTES:?MIN_FREE_BYTES nicht gesetzt}"

    about="$(rclone about storagebox: --json --config /config/rclone.conf)" || {
      echo "FEHLER: rclone about fehlgeschlagen"
      exit 1
    }
    free="$(printf '%s' "${about}" | tr ',{}' '\n' \
      | sed -n 's/.*"free": *\([0-9][0-9]*\).*/\1/p' | head -n 1)"
    if [ -z "${free}" ]; then
      echo "FEHLER: freier Platz nicht aus rclone-Ausgabe lesbar: ${about}"
      exit 1
    fi

    free_gib=$((free / 1024 / 1024 / 1024))
    min_gib=$((min_free / 1024 / 1024 / 1024))
    if [ "${free}" -lt "${min_free}" ]; then
      echo "FEHLER: nur noch ${free_gib} GiB frei, Schwelle ${min_gib} GiB"
      echo "Aufraeumen: restic forget/prune im Repo, Retention pruefen," \
        "oder Kontingent der Box erhoehen."
      exit 1
    fi
    echo "Storage Box: ${free_gib} GiB frei (Schwelle ${min_gib} GiB)"

  nextcloud-maintenance.sh: |
    #!/bin/sh
    set -u
    # Haelt Nextcloud nur fuer den konsistenzkritischen Teil im Wartungsmodus:
    # Freigabe, sobald /work/capture-complete existiert, nicht erst nach dem
    # restic-Upload. Jede Zustandsaenderung wird gegen
    # `occ config:system:get maintenance` verifiziert; eine unbestaetigte
    # Freigabe hinterlaesst einen Marker und laesst den Job scheitern.

    # Kurze Intervalle sind Pflicht: ein Trap laeuft in sh erst nach dem
    # laufenden Kommando. Mit langem sleep wuerde der Sidecar die Freigabe erst
    # nach Ablauf der Grace Period versuchen, also nach dem SIGKILL nie.
    idle() {
      while true; do
        sleep 5
      done
    }

    # Timeout, damit ein haengender exec das Script nicht blockiert.
    occ() {
      timeout 60 kubectl exec -n nextcloud deploy/nextcloud -c nextcloud -- \
        php occ "$@"
    }

    current_mode() {
      mode="$(occ config:system:get maintenance 2>/dev/null \
        | tail -n 1 | tr -d '[:space:]')"
      # Fehlt der Key ganz, ist der Wartungsmodus aus.
      [ -n "${mode}" ] || mode=false
      printf '%s' "${mode}"
    }

    # $1 = on|off, $2 = erwarteter Zustand (true|false)
    set_mode() {
      attempt=1
      while [ "${attempt}" -le 5 ]; do
        occ maintenance:mode "--$1" >/dev/null 2>&1
        if [ "$(current_mode)" = "$2" ]; then
          return 0
        fi
        echo "maintenance:mode --$1 nicht bestaetigt (Versuch ${attempt}/5)"
        attempt=$((attempt + 1))
        sleep 10
      done
      return 1
    }

    # Idempotent: laeuft aus dem Normalfluss UND aus dem TERM-Handler.
    release() {
      [ -f /work/maintenance-off ] && return 0
      if set_mode off false; then
        rm -f /work/maintenance-off.failed
        touch /work/maintenance-off
        echo "Wartungsmodus freigegeben und verifiziert"
        return 0
      fi
      touch /work/maintenance-off.failed
      echo "FEHLER: Wartungsmodus konnte nicht freigegeben werden"
      return 1
    }

    trap 'release; exit 0' TERM INT

    # Sidecar-Neustart nach dem kritischen Teil darf den Wartungsmodus nicht
    # erneut setzen -- dann nur noch freigeben.
    if [ -f /work/capture-complete ]; then
      echo "Neustart nach Capture-Phase, setze Wartungsmodus nicht erneut"
      until release; do sleep 10; done
      idle
    fi

    if set_mode on true; then
      touch /work/maintenance-ready
      echo "Wartungsmodus aktiv und verifiziert"
    else
      echo "FEHLER: Wartungsmodus konnte nicht aktiviert werden"
      touch /work/maintenance-failed
      # Halb gesetzter Zustand ist moeglich -- in jedem Fall wieder freigeben.
      release || true
      idle
    fi

    while [ ! -f /work/capture-complete ]; do
      sleep 5
    done

    # Ein read-only Dateisystem im Nextcloud-Pod laesst occ scheitern. Weiter
    # versuchen, solange der Pod lebt; der Marker bleibt bis zum Erfolg liegen.
    until release; do
      sleep 10
    done
    idle

  nextcloud-capture.sh: |
    #!/bin/sh
    set -u
    result=0
    mkdir -p /staging/database

    primary="$(kubectl get pods -n cnpg-system \
      -l cnpg.io/cluster=homelab-postgres,role=primary \
      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)"
    if [ -z "${primary}" ]; then
      echo "FEHLER: kein primaerer homelab-postgres-Pod gefunden"
      result=1
    elif ! kubectl exec -n cnpg-system "${primary}" -- \
      pg_dump -d nextcloud -Fc > /staging/database/nextcloud.dump; then
      echo "FEHLER: pg_dump der Nextcloud-Datenbank fehlgeschlagen"
      result=1
    fi

    if ! kubectl exec -n nextcloud deploy/nextcloud -c nextcloud -- \
      tar -C /var/www/html -czf - . > /staging/nextcloud-app.tar.gz; then
      echo "FEHLER: App-State-Tar aus /var/www/html fehlgeschlagen"
      result=1
    fi

    if [ "${result}" -eq 0 ]; then
      touch /work/nextcloud-capture.ok
    else
      touch /work/nextcloud-capture.failed
    fi
    exit 0

  finalize.sh: |
    #!/bin/sh
    set -u
    # Endabnahme: benennt fehlende Erfolgs-Marker explizit, damit ein
    # Fehlschlag im Job-Log lesbar ist.
    result=0

    # Die Freigabe des Wartungsmodus liegt lange vor diesem Schritt. Laeuft sie
    # noch (Retry), kurz Zeit geben.
    attempt=0
    while [ ! -f /work/maintenance-off ] && [ "${attempt}" -lt 30 ]; do
      sleep 10
      attempt=$((attempt + 1))
    done

    for flag in maintenance-off nextcloud-stage.ok nextcloud-capture.ok \
      nextcloud.ok; do
      if [ ! -f "/work/${flag}" ]; then
        echo "FEHLT: /work/${flag}"
        result=1
      fi
    done

    for marker in /work/*.failed; do
      [ -e "${marker}" ] || continue
      echo "FEHLERMARKER: ${marker}"
      result=1
    done

    if [ "${result}" -ne 0 ]; then
      echo "Zustand in /work:"
      ls -1 /work
      echo "Wartungsmodus pruefen: kubectl exec -n nextcloud deploy/nextcloud" \
        "-c nextcloud -- php occ maintenance:mode"
    else
      echo "Nextcloud-Offsite-Backup vollstaendig"
    fi
    exit "${result}"

  verify.sh: |
    #!/bin/sh
    set -u
    result=0

    fail() {
      echo "FEHLER: $1"
      result=1
    }

    for delay in 1 2 4 8 16; do
      restic snapshots >/dev/null 2>&1 && break
      sleep "${delay}"
    done
    restic check --read-data-subset=5% || fail "restic check"
    # security.*-xattrs bleiben aussen vor: der Container darf den SELinux-Label
    # des Zielverzeichnisses nicht setzen, restic wertet das als Fatal, obwohl
    # die Daten vollstaendig zurueckkommen.
    restic restore latest --host homelab --tag immich --exclude-xattr 'security.*' \
      --include '/staging/database/immich.dump' \
      --include '/staging/verify/immich-sample.path' \
      --include '/staging/verify/immich-sample.sha256' \
      --target /restore/immich \
      || fail "Restore immich-Dump/Manifest"
    restic restore latest --host homelab --tag nextcloud --exclude-xattr 'security.*' \
      --include '/staging/database/nextcloud.dump' \
      --include '/staging/nextcloud-app.tar.gz' \
      --include '/staging/verify/nextcloud-sample.path' \
      --include '/staging/verify/nextcloud-sample.sha256' \
      --target /restore/nextcloud \
      || fail "Restore nextcloud-Dump/App-State"
    restic restore latest --host homelab --tag forgejo --exclude-xattr 'security.*' \
      --include '/staging/database/forgejo.dump' \
      --include '/staging/verify/forgejo-sample.path' \
      --include '/staging/verify/forgejo-sample.sha256' \
      --target /restore/forgejo \
      || fail "Restore forgejo-Dump/Manifest"
    # Enthaelt nur Dumps, deshalb ohne --include-Filter.
    restic restore latest --host homelab --tag databases --exclude-xattr 'security.*' \
      --target /restore/databases \
      || fail "Restore Datenbank-Dumps"
    for tag in immich nextcloud forgejo; do
      manifest_root="/restore/${tag}/staging/verify"
      sample_path="$(cat "${manifest_root}/${tag}-sample.path" 2>/dev/null)" \
        || fail "Sample-Pfad ${tag} nicht lesbar"
      expected="$(cat "${manifest_root}/${tag}-sample.sha256" 2>/dev/null)" \
        || fail "Sample-Hash ${tag} nicht lesbar"
      if [ -n "${sample_path:-}" ] && [ -n "${expected:-}" ]; then
        restic restore latest --host homelab --tag "${tag}" --exclude-xattr 'security.*' \
          --include "${sample_path}" --target "/restore/${tag}-sample" \
          || fail "Restore Sample-Datei ${tag}"
        restored_path="/restore/${tag}-sample${sample_path}"
        actual="$(sha256sum "${restored_path}" 2>/dev/null | cut -d ' ' -f 1)" \
          || fail "Hash der restaurierten ${tag}-Sample-Datei"
        [ "${actual:-}" = "${expected}" ] \
          || fail "Hash-Vergleich ${tag}: erwartet ${expected}, gelesen ${actual:-leer}"
      else
        fail "Sample-Manifest ${tag} unvollstaendig"
      fi
    done
    if [ "${result}" -eq 0 ]; then
      restic prune || fail "restic prune"
    fi

    if [ "${result}" -eq 0 ]; then
      touch /work/restore.ok
      echo "Restore-Verifikation vollstaendig"
    else
      touch /work/restore.failed
    fi
    exit 0
