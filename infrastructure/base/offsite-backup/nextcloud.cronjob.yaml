apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-offsite-backup
  namespace: backup-offsite
  labels:
    # Opt-in fuer den generischen Job-Watchdog, siehe docs/runbooks/job-watchdog.md
    # max-age = 24h Intervall + 8h activeDeadlineSeconds
    homelab.f4mily.net/watchdog: "true"
    homelab.f4mily.net/max-age-hours: "32"
    homelab.f4mily.net/max-runtime-hours: "6"
spec:
  schedule: "30 4 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 28800
      template:
        spec:
          serviceAccountName: offsite-backup
          restartPolicy: Never
          terminationGracePeriodSeconds: 120
          # Reihenfolge ist bewusst gewaehlt: der lange Objekt-Sync und der
          # lange restic-Upload laufen OHNE Wartungsmodus, im Wartungsmodus
          # liegt nur der konsistenzkritische Kern (Nachsync + Dump + App-Tar).
          initContainers:
            - name: fetch-garage-credentials
              image: docker.io/alpine/k8s:1.36.2
              command:
                - /bin/sh
                - -ec
                - |
                  umask 077
                  kubectl get secret -n nextcloud nextcloud-s3-credentials \
                    -o jsonpath='{.data.access-key}' > /config/garage-access-key.b64
                  kubectl get secret -n nextcloud nextcloud-s3-credentials \
                    -o jsonpath='{.data.secret-key}' > /config/garage-secret-key.b64
              volumeMounts:
                - name: config
                  mountPath: /config
            - name: prepare-rclone
              image: docker.io/rclone/rclone:1.75.0
              command: ["/bin/sh", "/scripts/prepare-rclone.sh"]
              env:
                - name: STORAGEBOX_HOST
                  valueFrom:
                    secretKeyRef: {name: storagebox-credentials, key: STORAGEBOX_HOST}
                - name: STORAGEBOX_USERNAME
                  valueFrom:
                    secretKeyRef: {name: storagebox-credentials, key: STORAGEBOX_USERNAME}
                - name: STORAGEBOX_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: storagebox-credentials, key: STORAGEBOX_PASSWORD}
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
            - name: restic-server
              image: docker.io/rclone/rclone:1.75.0
              restartPolicy: Always
              args:
                - serve
                - restic
                - storagebox:homelab-gitops/restic
                - --addr=127.0.0.1:8080
                - --config=/config/rclone.conf
                - --cache-objects=false
              volumeMounts:
                # Schreibbar: rclone aktualisiert seine Config zur Laufzeit und
                # protokolliert sonst dauerhaft "Failed to save config".
                - name: config
                  mountPath: /config
            # Prefetch ausserhalb des Wartungsmodus. Best effort -- Fehler
            # werden nicht bewertet, der autoritative Sync folgt im Freeze.
            - name: stage-objects-prefetch
              image: docker.io/rclone/rclone:1.75.0
              command:
                - /bin/sh
                - -c
                - |
                  /bin/sh /scripts/stage-objects.sh \
                    || echo "Prefetch unvollstaendig, wird im Wartungsfenster nachgeholt"
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: staging
                  mountPath: /staging
            # Ab hier ist Nextcloud offline -- alles dahinter kurz halten.
            - name: maintenance
              image: docker.io/alpine/k8s:1.36.2
              restartPolicy: Always
              command: ["/bin/sh", "/scripts/nextcloud-maintenance.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
            - name: wait-maintenance
              image: docker.io/rclone/rclone:1.75.0
              command:
                - /bin/sh
                - -ec
                - |
                  # Budget bewusst groesser als der Worst Case des Sidecars,
                  # sonst setzt der den Wartungsmodus, nachdem das Gate schon
                  # aufgegeben hat.
                  for _ in $(seq 1 180); do
                    [ -f /work/maintenance-ready ] && exit 0
                    [ -f /work/maintenance-failed ] && exit 0
                    sleep 5
                  done
                  touch /work/maintenance-failed
              volumeMounts:
                - name: work
                  mountPath: /work
            - name: stage-objects
              image: docker.io/rclone/rclone:1.75.0
              command:
                - /bin/sh
                - -c
                - |
                  if [ ! -f /work/maintenance-ready ]; then
                    echo "Wartungsmodus nicht aktiv, Sync uebersprungen"
                    touch /work/nextcloud-stage.failed
                    exit 0
                  fi
                  if /bin/sh /scripts/stage-objects.sh; then
                    touch /work/nextcloud-stage.ok
                  else
                    touch /work/nextcloud-stage.failed
                  fi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: staging
                  mountPath: /staging
            - name: capture-state
              image: docker.io/alpine/k8s:1.36.2
              command:
                - /bin/sh
                - -c
                - |
                  if [ -f /work/nextcloud-stage.ok ]; then
                    /bin/sh /scripts/nextcloud-capture.sh
                  else
                    echo "Objekt-Sync nicht vollstaendig, Capture uebersprungen"
                    touch /work/nextcloud-capture.failed
                  fi
                  # Gibt den Wartungsmodus frei und muss deshalb in JEDEM Pfad
                  # gesetzt werden -- auch nach Fehlern.
                  touch /work/capture-complete
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: staging
                  mountPath: /staging
            # Nextcloud ist ab hier wieder online, der Upload laeuft aus dem
            # Staging und braucht die Anwendung nicht mehr.
            - name: backup
              image: docker.io/restic/restic:0.19.1
              command:
                - /bin/sh
                - -ec
                - |
                  if [ ! -f /work/nextcloud-stage.ok ] || \
                     [ ! -f /work/nextcloud-capture.ok ]; then
                    echo "Staging oder Capture fehlgeschlagen, kein Upload"
                    touch /work/nextcloud.failed
                    exit 0
                  fi
                  /bin/sh /scripts/record-sample.sh nextcloud /staging/objects
                  exec /bin/sh /scripts/restic-backup.sh nextcloud /staging
              env:
                - name: RESTIC_REPOSITORY
                  value: rest:http://127.0.0.1:8080/
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: storagebox-credentials
                      key: restic-password
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: staging
                  mountPath: /staging
          containers:
            - name: finalize
              image: docker.io/rclone/rclone:1.75.0
              command: ["/bin/sh", "/scripts/finalize.sh"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            - name: config
              emptyDir: {}
            - name: work
              emptyDir: {}
            - name: scripts
              configMap:
                name: offsite-backup-scripts
                defaultMode: 0555
            - name: staging
              persistentVolumeClaim:
                claimName: nextcloud-offsite-staging
