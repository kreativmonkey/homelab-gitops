apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-restore-verify
  namespace: backup-offsite
  labels:
    # Opt-in fuer den generischen Job-Watchdog, siehe docs/runbooks/job-watchdog.md
    # max-age = 168h Intervall + 6h activeDeadlineSeconds
    homelab.f4mily.net/watchdog: "true"
    homelab.f4mily.net/max-age-hours: "174"
    homelab.f4mily.net/max-runtime-hours: "5"
spec:
  schedule: "0 8 * * 0"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 60
          initContainers:
            - name: prepare-rclone
              image: docker.io/rclone/rclone:1.75.0
              command: ["/bin/sh", "/scripts/prepare-rclone.sh"]
              env:
                - name: STORAGEBOX_HOST
                  valueFrom:
                    secretKeyRef: {name: storagebox-credentials, key: STORAGEBOX_HOST}
                - name: STORAGEBOX_USERNAME
                  valueFrom:
                    secretKeyRef: {name: storagebox-credentials, key: STORAGEBOX_USERNAME}
                - name: STORAGEBOX_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: storagebox-credentials, key: STORAGEBOX_PASSWORD}
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
            - name: restic-server
              image: docker.io/rclone/rclone:1.75.0
              restartPolicy: Always
              args:
                - serve
                - restic
                - storagebox:homelab-gitops/restic
                - --addr=127.0.0.1:8080
                - --config=/config/rclone.conf
                - --cache-objects=false
              volumeMounts:
                # Schreibbar: rclone aktualisiert seine Config zur Laufzeit und
                # protokolliert sonst dauerhaft "Failed to save config".
                - name: config
                  mountPath: /config
            - name: restore
              image: docker.io/restic/restic:0.19.1
              command: ["/bin/sh", "/scripts/verify.sh"]
              env:
                - name: RESTIC_REPOSITORY
                  value: rest:http://127.0.0.1:8080/
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: storagebox-credentials
                      key: restic-password
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: restore
                  mountPath: /restore
          containers:
            - name: validate
              image: docker.io/library/postgres:18-alpine
              command:
                - /bin/sh
                - -ec
                - |
                  if [ ! -f /work/restore.ok ]; then
                    echo "restore.ok fehlt: verify.sh ist gescheitert," \
                      "Details im Log des restore-Containers"
                    exit 1
                  fi
                  immich_dump=/restore/immich/staging/database/immich.dump
                  nextcloud_dump=/restore/nextcloud/staging/database/nextcloud.dump
                  nextcloud_app=/restore/nextcloud/staging/nextcloud-app.tar.gz
                  for artefact in "${immich_dump}" "${nextcloud_dump}" \
                    "${nextcloud_app}"; do
                    if [ ! -s "${artefact}" ]; then
                      echo "Restauriertes Artefakt fehlt oder ist leer: ${artefact}"
                      exit 1
                    fi
                  done
                  pg_restore --list "${immich_dump}" >/dev/null \
                    || { echo "immich-Dump nicht lesbar"; exit 1; }
                  pg_restore --list "${nextcloud_dump}" >/dev/null \
                    || { echo "nextcloud-Dump nicht lesbar"; exit 1; }
                  tar -tzf "${nextcloud_app}" >/dev/null \
                    || { echo "nextcloud-App-Tar nicht lesbar"; exit 1; }
                  echo "Alle restaurierten Artefakte plausibel"
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: restore
                  mountPath: /restore
                  readOnly: true
          volumes:
            - name: config
              emptyDir: {}
            - name: work
              emptyDir: {}
            - name: restore
              emptyDir:
                sizeLimit: 10Gi
            - name: scripts
              configMap:
                name: offsite-backup-scripts
                defaultMode: 0555
