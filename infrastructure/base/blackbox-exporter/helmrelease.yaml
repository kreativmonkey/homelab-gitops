apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-blackbox-exporter
  namespace: monitoring
spec:
  interval: 1h
  timeout: 10m
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "11.20.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-repo
        namespace: flux-system
  values:
    priorityClassName: homelab-infrastructure

    # IMPORTANT: Split-horizon DNS. Public resolvers return WAN IPs which breaks
    # in-cluster probing (TLS handshake to wrong endpoint). Force homelab DNS.
    dnsPolicy: None
    dnsConfig:
      nameservers:
        - 192.168.10.1

    # http_2xx-Modul – prüft HTTP 200 + SSL-Zertifikatsgültigkeit
    # Timeout 15s für Java-/Django-Apps (sterling-pdf, tandoor).
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 15s
          http:
            valid_status_codes: [200]
            method: GET
            follow_redirects: true
            preferred_ip_protocol: "ip4"
            # Force SNI even if the prober connects to a resolved IP.
            # Otherwise some ingress frontends reset the connection with
            # `remote error: tls: internal error`.
            tls_config:
              server_name: home.f4mily.net
        # Separates Modul für Nextcloud: status.php antwortet auch im
        # Wartungsmodus erfolgreich, deshalb wird zusätzlich der Body geprüft.
        http_2xx_nextcloud_online:
          prober: http
          timeout: 15s
          http:
            valid_status_codes: [200]
            method: GET
            follow_redirects: true
            preferred_ip_protocol: "ip4"
            fail_if_body_matches_regexp:
              - '"maintenance":true'
            tls_config:
              server_name: home.f4mily.net
        # Separates Modul für tandoor (benötigt Host-Header)
        http_2xx_tandoor:
          prober: http
          timeout: 15s
          http:
            valid_status_codes: [200]
            method: GET
            follow_redirects: true
            preferred_ip_protocol: "ip4"
            headers:
              Host: rezepte.f4mily.net
            tls_config:
              server_name: rezepte.f4mily.net
        # MT-Rad (mt-rad.de, statisch auf dem VPS hinter traefik). Eigenes Modul,
        # weil http_2xx SNI auf home.f4mily.net festnagelt — das LE-Zert von
        # mt-rad.de passt darauf nicht. Ohne tls_config gilt der Ziel-Host als
        # SNI. Der Body-Check faengt eine leere oder halb deployte Site ab
        # (nginx 403 statt Seite). Das www-Zert prueft ein zweites Modul ohne Redirect.
        http_2xx_mtrad:
          prober: http
          timeout: 15s
          http:
            valid_status_codes: [200]
            method: GET
            follow_redirects: true
            fail_if_not_ssl: true
            preferred_ip_protocol: "ip4"
            fail_if_body_not_matches_regexp:
              - "MT-Rad"
        # www leitet GET mit 301 auf den Apex um. Ohne Redirect prueft Blackbox
        # das www-Zert selbst statt nur das Zertifikat der Zielseite.
        http_301_mtrad_www:
          prober: http
          timeout: 15s
          http:
            valid_status_codes: [301]
            method: GET
            follow_redirects: false
            fail_if_not_ssl: true
            preferred_ip_protocol: "ip4"
            fail_if_header_not_matches:
              - header: Location
                regexp: '^https://mt-rad\.de/$'

    # Blackbox-Exporter ist extrem leichtgewichtig
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
