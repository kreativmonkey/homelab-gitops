# Statische node-lokale Volumes als PV-Typ `local`.
#
# Gedacht fuer Workloads, deren gesamter unersetzlicher Zustand klein ist und
# die node-lokal robuster laufen als ueber truenas-iscsi. Kein Provisioner:
# PV und PVC stehen explizit im Git, reclaimPolicy Retain, damit ein
# geloeschtes Claim keine Daten mitnimmt.
#
# WaitForFirstConsumer, weil ein local-Volume an genau einen Node gebunden ist
# und der Scheduler das vor der Bindung wissen muss.
#
# Abgrenzung zu local-path: local-path ist der richtige Weg fuer beliebig oft
# neu erzeugbare Volumes (CNPG-Instanzen replizieren auf DB-Ebene, ein Replica
# darf jederzeit weggeworfen werden). Diese StorageClass ist fuer den
# umgekehrten Fall: Volumes, die man benannt, versioniert und mit Retain haben
# will.
#
# ===========================================================================
# VORAUSSETZUNG: der Datentraeger muss fuer das kubelet sichtbar sein.
#
# Betroffen ist alles, was das kubelet SELBST mountet: `local`-PVs und JEDER
# `subPath`-Mount. Sieht das kubelet den Datentraeger nicht, loest es den Pfad
# gegen ein leeres Verzeichnis der System-Partition auf — still, ohne Event.
# hostPath-PVs (local-path-provisioner) sind unbetroffen, ihr Pfad geht per CRI
# an containerd im Host-Namespace. Daran scheiterten PR #802 und #805.
#
# Seit Talos 1.14 Multi-Doc-Config gibt es kein `kubelet.extraMounts` mehr
# (KubeletConfig kennt es nicht, `.machine.kubelet` kollidiert mit
# KubeletConfig). Das kubelet sieht nur `/var/mnt` (rbind, rslave). Darum
# haengt die Datenplatte als ExistingVolumeConfig `local-storage` unter
# /var/mnt/local-storage (Omni-Config-Patch je Node, `mount.secure: false`
# fuer exec-Paritaet mit dem frueheren Mount).
#
# Pruefen immer per hostPath-Sicht gegen subPath-Sicht, nie zwei Zugriffe
# derselben Art — /proc/mounts taugt nicht, dort steht in beiden Faellen
# `overlay`. Details: docs/learnings/talos-kubelet-extramounts-local-storage.md
# ===========================================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-node-static
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: false
