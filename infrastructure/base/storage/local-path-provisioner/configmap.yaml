apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
data:
  # Backing path: node data disk sdb1, mounted by Talos as ExistingVolumeConfig
  # `local-storage` at /var/mnt/local-storage (Omni config patch per node).
  # A PV's hostPath is immutable — changing the path means re-creating PVs
  # (CNPG: rolling delete pod+PVC, see infrastructure/AGENTS.md).
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/var/mnt/local-storage/local-path"]
        }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: helper-pod
          # renovate: datasource=docker depName=docker.io/library/busybox
          image: docker.io/library/busybox:1.38.0
          imagePullPolicy: IfNotPresent
