apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-iscsi
  namespace: democratic-csi
spec:
  interval: 1h
  timeout: 15m
  targetNamespace: democratic-csi
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: democratic-csi
      version: "0.15.1"
      sourceRef:
        kind: HelmRepository
        name: democratic-csi-repo
        namespace: flux-system
  values:
    csiDriver:
      name: truenas-iscsi
    driver:
      config:
        driver: freenas-api-iscsi
      existingConfigSecret: truenas-iscsi-driver-config
    controller:
      # The chart's controller liveness probe calls the CSI Probe RPC, which
      # pings the TrueNAS API. Transient TrueNAS API 500s (NAS VM under load /
      # storage stall) made the otherwise-healthy controller restart-loop (94x)
      # and page KubePodCrashLoopBackOff. failureThreshold/periodSeconds are
      # hardcoded in the chart (not tunable), and restarting never fixes the
      # backend — so disable the backend-coupled liveness. Real process crashes
      # still exit the container and get restarted by the kubelet normally.
      livenessProbe:
        enabled: false
      driver:
        image:
          # Pinned to a released version. `next` is the rolling dev tag (issue #736)
          # and must not run in production.
          tag: v1.9.5
        # p95/p99-derived (14d/7d VictoriaMetrics history), previously unset
        # (Burstable, first-to-be-OOM-killed). No CPU limit by convention.
        resources:
          requests:
            cpu: 10m
            memory: 112Mi
          limits:
            memory: 192Mi
      externalAttacher:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      externalProvisioner:
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
      externalResizer:
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
      externalSnapshotter:
        # Velero uses filesystem backups and snapshotsEnabled=false. Running
        # this sidecar without snapshot.storage.k8s.io CRDs only creates noise.
        enabled: false
    node:
      hostPID: true
      cleanup:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      driver:
        image:
          # Pinned to a released version. `next` is the rolling dev tag (issue #736)
          # and must not run in production.
          tag: v1.9.5
        extraEnv:
          - name: ISCSIADM_HOST_STRATEGY
            value: nsenter
          - name: ISCSIADM_HOST_PATH
            value: /usr/local/sbin/iscsiadm
        iscsiDirHostPath: /var/iscsi
        iscsiDirHostPathType: ""
        resources:
          requests:
            cpu: 40m
            memory: 192Mi
          limits:
            memory: 320Mi
      driverRegistrar:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
    # Shared csi-grpc-proxy sidecar injected into both the controller and node
    # pods (single top-level key, no per-pod override in the chart). Both
    # pods measured to the same target, so one value covers both.
    csiProxy:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    storageClasses:
    - name: truenas-iscsi
      defaultClass: true
      reclaimPolicy: Delete
      # WaitForFirstConsumer binds the PV to the node where the pod actually
      # schedules, instead of provisioning node-unbound up front. Affects only
      # new PVCs — existing volumes keep their current binding.
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
      parameters:
          detachedVolumesFromSnapshots: "false"
          fsType: ext4
          # VolumeSnapshotClass requires snapshot.storage.k8s.io CRDs (not installed yet).
    # XFS-Variante. Vor der Nutzung docs/learnings/nextcloud-iscsi-emergency-readonly.md
    # lesen: XFS erholt sich nach einem Transport-Stall zwar besser, ist dabei
    # aber schlechter beobachtbar — es fuehrt keinen persistenten Fehlerzaehler
    # wie /sys/fs/ext4/<dev>/errors_count, und ein XFS-Shutdown steht nur im
    # Kernel-Log. Solange Talos-Kernel-Logs nicht in VictoriaLogs landen, kostet
    # ein Wechsel genau das Signal, das den Ausfall vom 24.08.2026 sichtbar macht.
    - name: truenas-iscsi-xfs
      defaultClass: false
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
      parameters:
          detachedVolumesFromSnapshots: "false"
          fsType: xfs
