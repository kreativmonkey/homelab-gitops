apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
  annotations:
    kustomize.toolkit.fluxcd.io/depends-on: helm.toolkit.fluxcd.io/HelmRelease/democratic-csi/democratic-csi-iscsi
spec:
  interval: 1h
  targetNamespace: velero
  chart:
    spec:
      chart: velero
      version: "12.1.0"
      sourceRef:
        kind: HelmRepository
        name: velero-repo
        namespace: flux-system
  values:
    global:
      priorityClassName: "homelab-infrastructure"
    snapshotsEnabled: false
    configuration:
      backupStorageLocation:
        - name: default
          bucket: velero
          default: true
          provider: aws
          credential:
            name: velero-credentials
            key: cloud
          config:
            region: garage
            s3Url: http://192.168.10.94:30188
            s3ForcePathStyle: "true"
            insecureSkipTLSVerify: "true"
            checksumAlgorithm: ""
      volumeSnapshotLocation: []
    initContainers:
      - name: velero-plugin-for-aws
        # v1.14.2 corrupts backup objects on S3-compatible backends because
        # AWS SDK checksum defaults ignore checksumAlgorithm: "". Keep Garage
        # on v1.14.1 until the upstream fix ships in v1.14.3.
        # https://github.com/velero-io/velero/issues/9951
        image: velero/velero-plugin-for-aws:v1.14.1
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
    credentials:
      existingSecret: velero-credentials
    # Filesystem backups need one node-agent pod per node. `nodeAgent.enabled`
    # is not a chart value in Velero 12.x and silently rendered no DaemonSet.
    deployNodeAgent: true
    nodeAgent:
      priorityClassName: "homelab-infrastructure"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
    # `velero:` is not a top-level key in this chart (verified via `helm
    # template` against a clean checkout: the pre-existing `resources:`
    # below rendered as nothing on the velero container, matching Phase-1's
    # metrics finding of no current request/limit). priorityClassName is a
    # separate, real pre-existing bug left untouched here (out of scope for
    # this memory-requests change) — the correct resources path is the
    # top-level `resources:` key below.
    velero:
      priorityClassName: "homelab-infrastructure"
    # p95/p99-derived (14d/7d VictoriaMetrics history), previously unset
    # (Burstable, first-to-be-OOM-killed). No CPU limit by convention.
    # Limit = 28d-Peak (214Mi) + 35 %; Backup-Läufe sind schubweise, und ein
    # OOM mitten im Lauf kostet das Backup.
    resources:
      requests:
        cpu: 20m
        memory: 80Mi
      limits:
        memory: 320Mi
    metrics:
      enabled: true
      service:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8085"
