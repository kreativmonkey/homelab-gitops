# Default ServiceAccount in every managed namespace.
# automountServiceAccountToken:false removes the implicit API credential
# from all workloads that use the default SA (the ~44 app/infra pods that
# never call the Kubernetes API). Services that genuinely need API access
# use a dedicated SA with automountServiceAccountToken:true
# (remediation-api, n8n, mcp-server, ai-agents, operators).
# Issue #744 — SA-Tokens überall gemountet.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ai-agents
  labels:
    app.kubernetes.io/part-of: sa-token-hardening
automountServiceAccountToken: false
---
