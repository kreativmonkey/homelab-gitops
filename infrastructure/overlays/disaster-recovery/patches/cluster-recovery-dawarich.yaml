# Strategic merge: bootstrap from latest Barman backup in S3 (see docs/disaster-recovery/cnpg-s3-dr.md)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dawarich-postgres
  namespace: cnpg-system
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  bootstrap:
    recovery:
      source: dawarich-postgres
  externalClusters:
    - name: dawarich-postgres
      barmanObjectStore:
        destinationPath: s3://cnpg-backups/dawarich-postgres
        # Public WebPKI endpoint; CNPG verifies the normal system trust store.
        endpointURL: https://s3.nas.f4mily.net
        serverName: dawarich-postgres
        s3Credentials:
          accessKeyId:
            name: cnpg-barman-s3-credentials
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: cnpg-barman-s3-credentials
            key: ACCESS_SECRET_KEY
        wal:
          compression: gzip
          maxParallel: 4
