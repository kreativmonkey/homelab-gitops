apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-key-v2
  namespace: secret-source
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: CreatedOnce
  target:
    name: searxng-key-v2
    creationPolicy: Orphan
    immutable: true
    template:
      metadata:
        labels:
          app.kubernetes.io/name: searxng
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-32
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-searxng-key
  namespace: secret-source
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames: [searxng-key-v2]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-searxng-key
  namespace: secret-source
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-searxng-key
subjects:
  - kind: ServiceAccount
    name: eso-store-reader
    namespace: searxng
