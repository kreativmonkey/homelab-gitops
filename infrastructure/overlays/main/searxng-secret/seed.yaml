apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-searxng-seed
  namespace: secret-source
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-searxng-seed-token
  namespace: secret-source
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    verbs: [create]
    resourceNames: [eso-searxng-seed]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-searxng-seed-token
  namespace: secret-source
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-searxng-seed-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-searxng-seed-read
  namespace: searxng
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames: [searxng-secret]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-searxng-seed-read
  namespace: searxng
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-searxng-seed-read
subjects:
  - kind: ServiceAccount
    name: eso-searxng-seed
    namespace: secret-source
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: searxng-seed
  namespace: secret-source
spec:
  provider:
    kubernetes:
      remoteNamespace: searxng
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-searxng-seed
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-key
  namespace: secret-source
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: SecretStore
    name: searxng-seed
  target:
    creationPolicy: Orphan
    immutable: true
    template:
      mergePolicy: Merge
      metadata:
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
  data:
    - secretKey: password
      remoteRef:
        key: searxng-secret
        property: SEARXNG_SECRET
